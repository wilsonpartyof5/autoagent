<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="autoagent-widget-version" content="v25">
  <title>AutoAgent Vehicle Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#0d0f12;--panel:#17191d;--panel2:#202329;--text:#f8fafc;--muted:#a1a8b3;
      --line:#343842;--blue:#2878ff;--blue2:#1557c8;--red:#d8322f;--shadow:0 12px 32px #0008;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;min-height:620px;overflow:hidden;background:var(--bg);color:var(--text)}
    button,input{font:inherit} button{color:inherit}.hidden{display:none!important}
    #app{position:relative;width:100%;height:620px;min-height:540px;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--bg)}
    #workspace{display:grid;grid-template-columns:1fr;width:100%;height:100%}
    #resultsPane{display:none;background:var(--panel);border-right:1px solid var(--line);min-width:0;overflow:hidden}
    #resultsHeader{height:62px;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    #resultCount{font-weight:750}.subtle{font-size:12px;color:var(--muted)}
    #list{height:calc(100% - 62px);overflow:auto;padding:10px;display:grid;gap:10px;align-content:start}
    #mapPane{position:relative;min-width:0;height:100%;overflow:hidden}
    #map{position:absolute;inset:0;background:#d8e4e8}.leaflet-container{font-family:inherit}
    .leaflet-control-attribution{font-size:9px!important}
    .topbar{position:absolute;z-index:700;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
    .control-scroll{display:flex;gap:7px;overflow:auto;scrollbar-width:none;pointer-events:auto;padding:1px}
    .pill,.icon-btn,.primary-btn{border:1px solid #ffffff30;background:#15171bea;backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px #0004}
    .pill:hover,.pill.active,.icon-btn:hover{border-color:#75a7ff;background:#173f78}.pill:disabled{opacity:.55;cursor:wait}
    .icon-btn{margin-left:auto;width:42px;height:42px;padding:0;font-size:18px;pointer-events:auto}
    .primary-btn{background:var(--blue);border-color:var(--blue);border-radius:10px;padding:11px 17px}.primary-btn:hover{background:var(--blue2)}
    #searchArea{position:absolute;z-index:710;top:66px;left:50%;transform:translateX(-50%);background:#fff;color:#172033;border:0;border-radius:999px;padding:10px 16px;font-weight:800;box-shadow:var(--shadow);cursor:pointer}
    #searchArea[disabled]{opacity:.65}
    .price-pin,.cluster-pin{transform:translate(-50%,-50%);background:var(--red);color:#fff;border:2px solid #fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850;box-shadow:0 4px 12px #0007;white-space:nowrap;transition:transform .16s,border-color .16s,background .16s}
    .price-pin.selected{background:var(--blue);border-color:#dbeafe;transform:translate(-50%,-50%) scale(1.13);z-index:5}
    .cluster-pin{background:#20242ae8;border-radius:12px;min-width:86px;text-align:center;padding:7px 9px}.cluster-pin span{display:block;font-size:10px;color:#c5cad1;font-weight:650}
    .leaflet-div-icon{background:transparent!important;border:0!important}
    #embeddedCards{position:absolute;z-index:650;left:12px;right:12px;bottom:12px;pointer-events:none}
    #featured{pointer-events:auto;margin:0 auto 10px;max-width:760px;touch-action:manipulation}
    #rail{pointer-events:auto;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;padding:2px 0 6px}
    #rail::-webkit-scrollbar,.gallery::-webkit-scrollbar,.control-scroll::-webkit-scrollbar{display:none}
    .vehicle-card{background:#121417f2;border:1px solid var(--line);border-radius:15px;overflow:hidden;display:grid;grid-template-columns:112px 1fr;min-height:112px;cursor:pointer;transition:border-color .15s,transform .15s;scroll-snap-align:start;touch-action:manipulation;-webkit-user-select:none;user-select:none}
    .vehicle-card:hover,.vehicle-card.active{border-color:#4f91ff;transform:translateY(-1px)}.vehicle-card img{width:112px;height:100%;min-height:112px;object-fit:cover;background:#2a2d32;pointer-events:none}
    .vehicle-card .copy{padding:10px;min-width:0}.vehicle-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vehicle-price{font-size:20px;font-weight:850;color:#5a9bff;margin-top:2px}
    .vehicle-meta,.dealer{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #featured .vehicle-card{grid-template-columns:150px 1fr;min-height:128px}#featured .vehicle-card img{width:150px;min-height:128px}
    #rail .vehicle-card{flex:0 0 260px;grid-template-columns:92px 1fr;min-height:96px}#rail .vehicle-card img{width:92px;min-height:96px}#rail .vehicle-price{font-size:16px}
    .list-card{grid-template-columns:112px 1fr}.list-card .vehicle-price{font-size:18px}
    #status{position:absolute;z-index:900;inset:0;display:grid;place-items:center;background:#0d0f12d9;padding:24px;text-align:center}
    .status-card{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
    .spinner{width:30px;height:30px;border:3px solid #ffffff28;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
    #toast{position:absolute;z-index:1100;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(520px,90%);background:#121417ed;border:1px solid var(--line);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);font-size:13px}
    .drawer,.modal{position:absolute;z-index:1000;inset:0;background:#0e1013f7;overflow:auto;padding:18px}
    #details.drawer{display:flex;flex-direction:column;padding:0;overflow:hidden}
    #details.drawer.hidden{display:none!important}
    .drawer-panel,.modal-panel{max-width:760px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
    #details .drawer-panel{display:flex;flex-direction:column;width:100%;height:100%;max-width:none;margin:0;border-radius:0;overflow:hidden;border:0}
    .drawer-head,.modal-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top))}
    #details .drawer-head{position:relative;flex:0 0 auto;top:auto}
    .drawer-head h2,.modal-head h2{margin:0;font-size:17px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-back{flex:0 0 auto;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:750;white-space:nowrap}
    .close{margin-left:0;background:transparent;border:0;font-size:28px;line-height:1;cursor:pointer;width:40px;height:40px;border-radius:999px}
    .close:hover{background:#ffffff14}
    #detailBody{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:16px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    .hero-wrap{position:relative;border-radius:13px;overflow:hidden;background:#292c31}
    .hero-image{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#292c31;touch-action:manipulation}
    .hero-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:999px;background:#0d0f12cc;color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2;touch-action:manipulation}
    .hero-nav.prev{left:8px}.hero-nav.next{right:8px}.hero-nav:disabled{opacity:.35;cursor:default}
    .hero-count{position:absolute;right:10px;bottom:10px;background:#0d0f12cc;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
    .gallery{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;margin-top:10px;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:2px 0 6px}
    .gallery-thumb{flex:0 0 auto;width:112px;height:76px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#292c31;cursor:pointer;scroll-snap-align:start;touch-action:manipulation}
    .gallery-thumb.active{border-color:var(--blue)}.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .vdp-footer-nav{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:12px;background:linear-gradient(180deg,#17191d00,#17191df2 28%,#17191d);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
    .spec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.spec{background:#101215;border:1px solid #292d34;border-radius:11px;padding:11px}.spec label{display:block;color:var(--muted);font-size:11px}.spec strong{display:block;margin-top:3px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.secondary{background:#20242a;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
    form{padding:16px;display:grid;gap:12px}label.field{display:grid;gap:5px;font-weight:700;font-size:13px}input{width:100%;background:#0f1114;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}input:focus{outline:2px solid #4f91ff}
    .consent{display:flex;align-items:flex-start;gap:8px;font-size:13px}.consent input{width:auto;margin-top:2px}
    body.fullscreen #app{height:100vh;max-height:none;border:0;border-radius:0;padding-bottom:env(safe-area-inset-bottom)}
    body.fullscreen #workspace{grid-template-columns:360px minmax(0,1fr)}
    body.fullscreen #resultsPane{display:block}
    body.fullscreen #embeddedCards{display:none}
    body.fullscreen #mapPane{height:100%}
    .sheet-handle{display:none}
    @media(max-width:1023px){
      body.fullscreen #workspace{display:block}
      body.fullscreen #resultsPane{display:block;position:absolute;z-index:720;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));height:42vh;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:height .2s}
      body.fullscreen #resultsPane.expanded{height:78vh}
      body.fullscreen #mapPane{height:100%}
      .sheet-handle{display:block;width:46px;height:5px;border:0;border-radius:3px;background:#7d8490;margin:7px auto;cursor:pointer}
      #resultsHeader{height:52px;padding-top:4px}#list{height:calc(100% - 52px);grid-auto-flow:column;grid-auto-columns:min(82vw,330px);grid-template-rows:1fr;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none}
      #list .vehicle-card{height:100%}
    }
    @media(max-width:640px){
      #app{height:580px;min-height:520px;border-radius:18px}.topbar{top:8px;left:8px;right:8px}.pill{padding:8px 11px;font-size:12px}
      #embeddedCards{left:8px;right:8px;bottom:8px}#featured .vehicle-card{grid-template-columns:118px 1fr;min-height:116px}#featured .vehicle-card img{width:118px;min-height:116px}
      #rail .vehicle-card{flex-basis:225px}.gallery-thumb{width:96px;height:68px}.spec-grid{grid-template-columns:1fr}.drawer,.modal{padding:0}.drawer-panel,.modal-panel{min-height:100%;border-radius:0}
      .nav-back{padding:8px 10px;font-size:12px}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main id="app" aria-label="Vehicle search map">
    <div id="workspace">
      <aside id="resultsPane" aria-label="Vehicle results">
        <button id="sheetHandle" class="sheet-handle" aria-label="Expand results panel"></button>
        <header id="resultsHeader"><div><div id="resultCount">Vehicles</div><div id="resultContext" class="subtle"></div></div><button id="inlineButton" class="secondary nav-back">← Map</button></header>
        <div id="list"></div>
      </aside>
      <section id="mapPane" aria-label="Interactive vehicle map">
        <div id="map"></div>
        <div class="topbar">
          <div class="control-scroll" id="controls">
            <button class="pill" data-filter="used">Used</button>
            <button class="pill" data-filter="new">New</button>
            <button class="pill" data-filter="under30">Under $30k</button>
            <button class="pill" data-filter="suv">SUV</button>
            <button class="pill" id="refineButton">Refine in ChatGPT</button>
            <button class="pill" id="resetButton">Reset</button>
          </div>
          <button id="expandButton" class="icon-btn" aria-label="Open fullscreen map">↗</button>
        </div>
        <button id="searchArea" class="hidden">Search this area</button>
        <div id="embeddedCards"><div id="featured"></div><div id="rail"></div></div>
      </section>
    </div>
    <div id="status"><div class="status-card"><div class="spinner"></div><strong id="statusTitle">Loading live vehicles</strong><p id="statusCopy" class="subtle">Connecting the map to ChatGPT…</p></div></div>
    <div id="toast" class="hidden" role="status"></div>
    <section id="details" class="drawer hidden" aria-modal="true" role="dialog">
      <div class="drawer-panel">
        <header class="drawer-head">
          <button id="detailBack" class="secondary nav-back" type="button">← Map</button>
          <h2 id="detailTitle">Vehicle</h2>
          <button id="detailClose" class="close" type="button" aria-label="Close vehicle details">×</button>
        </header>
        <div id="detailBody"></div>
      </div>
    </section>
    <section id="leadModal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-panel"><header class="modal-head"><h2>Book Test Drive</h2><button id="leadClose" class="close" aria-label="Close">×</button></header>
        <form id="leadForm"><div id="leadError" class="hidden"></div>
          <label class="field">Full name<input id="leadName" required autocomplete="name"></label>
          <label class="field">Email<input id="leadEmail" type="email" required autocomplete="email"></label>
          <label class="field">Phone<input id="leadPhone" type="tel" autocomplete="tel"></label>
          <label class="field">Preferred contact time<input id="leadTime"></label>
          <label class="consent"><input id="leadConsent" type="checkbox" required> I agree to be contacted by the dealer regarding this vehicle.</label>
          <button id="leadSubmit" class="primary-btn" type="submit">Submit request</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module">
    const VERSION='v25', HOST='https://autoagentmcp-server-production.up.railway.app';
    const FALLBACK_IMAGE='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300"><rect width="100%" height="100%" fill="#292c31"/><text x="50%" y="50%" fill="#a1a8b3" font-family="Arial" font-size="22" text-anchor="middle">Vehicle image unavailable</text></svg>');
    const instanceId=`widget_${globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)}`;
    const $=id=>document.getElementById(id);
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const state={all:[],visible:[],query:{},dealerSummary:[],selectedId:null,displayMode:'inline',sheetExpanded:false,pending:false,filters:{},flowId:instanceId};
    let readySent=false,bridgeSubscribed=false,lastResults=null,toastTimer=null,lastReportedHeight=0;
    function hasLiveVehicles(results=lastResults){
      const vehicles=Array.isArray(results?.vehicles)?results.vehicles:Array.isArray(results)?results:[];
      return vehicles.length>0;
    }
    function captureHostSearchParams(){
      const candidates=[window.openai?.toolInput,window.openai?.widgetState?.modelContent?.currentSearch,state.query];
      for(const input of candidates){
        if(input&&typeof input==='object'){
          pendingSearchParams={...pendingSearchParams,...input};
          state.query={...state.query,...input};
        }
      }
      const outputResults=extractResults(window.openai?.toolOutput)||extractResults(window.openai?.toolResponseMetadata);
      if(outputResults)rememberSearchParams(outputResults);
    }
    function resolvedSearchParams(){
      captureHostSearchParams();
      const merged={...state.query,...pendingSearchParams};
      const make=typeof merged.make==='string'?merged.make.trim():'';
      const model=typeof merged.model==='string'?merged.model.trim():'';
      const location=typeof merged.location==='string'&&merged.location.trim()?merged.location.trim():'';
      const condition=typeof merged.condition==='string'&&merged.condition.trim()?merged.condition.trim():'used';
      const radiusMiles=Number(merged.radiusMiles)||75;
      return {make,model,location,condition,radiusMiles};
    }

    function reportIntrinsicHeight(reason='update'){
      if(state.displayMode==='fullscreen'||typeof window.openai?.notifyIntrinsicHeight!=='function')return false;
      const appHeight=Math.max(520,Math.ceil($('app')?.getBoundingClientRect().height||620));
      if(Math.abs(appHeight-lastReportedHeight)<4)return true;
      window.openai.notifyIntrinsicHeight(appHeight);
      lastReportedHeight=appHeight;
      event('layout:height',{detail:`${reason}:${appHeight}`});
      return true;
    }

    function event(tag,payload={}){
      const flowId=state.flowId||instanceId;
      fetch(`${HOST}/widget/beacon`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({flowId,rid:flowId,tag,widgetVersion:VERSION,vehicleCount:state.all.length,...payload})}).catch(()=>{});
    }
    function toast(message,error=false){clearTimeout(toastTimer);const node=$('toast');node.textContent=message;node.style.borderColor=error?'#ef4444':'';node.classList.remove('hidden');toastTimer=setTimeout(()=>node.classList.add('hidden'),3500)}
    function showStatus(title,copy){$('statusTitle').textContent=title;$('statusCopy').textContent=copy;$('status').classList.remove('hidden')}
    function hideStatus(){$('status').classList.add('hidden')}
    function extractResults(payload){return payload?.structuredContent?.results||payload?._meta?.results||payload?.result?.structuredContent?.results||payload?.result?._meta?.results||payload?.toolOutput?.structuredContent?.results||payload?.toolOutput?._meta?.results||payload?.toolResponseMetadata?.mcp_tool_result?._meta?.results||payload?.toolResponseMetadata?.call_tool_result?._meta?.results||payload?.results||null}
    let pendingSearchParams=null;let selfFetchAttempted=false;let emptyResultSeen=false;
    function rememberSearchParams(results){
      const next=results?.searchParams||results?.query;
      if(next&&typeof next==='object'){pendingSearchParams={...pendingSearchParams,...next};state.query={...state.query,...next}}
    }
    function persistState(){
      const map=MapController.map;
      const center=map?.getCenter();
      window.openai?.setWidgetState?.({modelContent:{currentSearch:state.query,selectedVehicleId:state.selectedId,visibleVehicleIds:state.visible.slice(0,20).map(v=>v.id),map:center?{latitude:center.lat,longitude:center.lng,zoom:map.getZoom()}:null,activeFilters:state.filters},privateContent:{displayMode:state.displayMode,sheetExpanded:state.sheetExpanded},imageIds:[]});
    }
    function emitReady(tag){if(readySent||typeof window.openai?.emitToolEvent!=='function')return;window.openai.emitToolEvent('ui:ready',{ok:true,tag,flowId:state.flowId,widgetVersion:VERSION});readySent=true;event('ui-ready',{detail:tag})}
    function hydrate(results,source='unknown'){
      if(!results)return false;
      rememberSearchParams(results);
      const vehicles=Array.isArray(results.vehicles)?results.vehicles:Array.isArray(results)?results:[];
      if(!vehicles.length){
        emptyResultSeen=true;
        // Keep waiting so a later successful tool call (or constrained self-fetch) can hydrate.
        showStatus('Waiting for live vehicle data','ChatGPT is still preparing the map. Results will appear automatically when ready.');
        event('hydrate:empty',{detail:`source=${source}`});
        scheduleSelfFetch('empty-result');
        return false;
      }
      // Never let a recovery self-fetch overwrite inventory already delivered by the host.
      if(String(source).startsWith('self-fetch:')&&hasLiveVehicles()){
        event('hydrate:skip-overwrite',{detail:`source=${source}`,vehicleCount:lastResults?.vehicles?.length||state.all.length});
        return true;
      }
      lastResults=results;state.all=vehicles;state.visible=[...vehicles];state.query=results.searchParams||results.query||state.query;state.dealerSummary=results.dealerSummary||[];state.flowId=vehicles[0]?.flowId||state.flowId;state.selectedId=state.selectedId&&vehicles.some(v=>v.id===state.selectedId)?state.selectedId:vehicles[0].id;
      hideStatus();renderAll();reportIntrinsicHeight('hydrate');MapController.render(true);persistState();event('hydrate:success',{detail:`source=${source}`,vehicleCount:vehicles.length});emitReady('hydrated');return true;
    }
    function receive(payload,source){const results=extractResults(payload);if(results&&results!==lastResults)hydrate(results,source)}
    async function selfFetchVehicles(reason='timeout'){
      if(selfFetchAttempted||hasLiveVehicles()||state.pending)return;
      // Host may have delivered toolOutput while we were waiting — prefer that over inventing a search.
      captureHostSearchParams();
      receive(window.openai?.toolOutput,'self-fetch.precheck.output');
      receive(window.openai?.toolResponseMetadata,'self-fetch.precheck.meta');
      if(hasLiveVehicles()){event('self-fetch:aborted-host-data',{detail:reason});return}
      if(typeof window.openai?.callTool!=='function'){event('self-fetch:unavailable',{detail:reason});return}
      const resolved=resolvedSearchParams();
      // Never broad-search without make — that returns random inventory and overwrites the real query.
      if(!resolved.make){
        event('self-fetch:skipped-no-make',{detail:reason});
        showStatus('Waiting for live vehicle data','ChatGPT is still preparing the map. Results will appear automatically when ready.');
        return;
      }
      const params={
        make:resolved.make,
        condition:resolved.condition,
        radiusMiles:resolved.radiusMiles,
      };
      if(resolved.model)params.model=resolved.model;
      if(resolved.location)params.location=resolved.location;
      // Drop bodyStyle on recovery — invented body styles are a common cause of 0-hit first renders.
      selfFetchAttempted=true;state.pending=true;
      showStatus('Loading live vehicles','Refreshing inventory for the map…');
      event('self-fetch:start',{detail:`${reason};make=${params.make};model=${params.model||''}`});
      try{
        const result=await window.openai.callTool('render-vehicle-results-v2',params);
        if(hasLiveVehicles()){event('self-fetch:discarded-stale',{detail:reason});return}
        const next=extractResults(result);
        if(!next||!hydrate(next,`self-fetch:${reason}`)){
          if(!hasLiveVehicles()){
            showStatus('No vehicles found','Try revising the location, price, or vehicle type in ChatGPT.');
            event('self-fetch:empty',{detail:reason});
          }
        }
      }catch(error){
        event('self-fetch:error',{detail:String(error?.message||error)});
        if(emptyResultSeen&&!hasLiveVehicles())showStatus('No vehicles found','Try revising the location, price, or vehicle type in ChatGPT.');
      }finally{state.pending=false}
    }
    function scheduleSelfFetch(reason){
      setTimeout(()=>{if(!hasLiveVehicles())selfFetchVehicles(reason)},1800);
    }
    function attachBridge(){
      if(bridgeSubscribed||typeof window.openai?.on!=='function')return false;
      ['tool-result','toolResult','ui/notifications/tool-result','openai/tool-result'].forEach(name=>{try{window.openai.on(name,value=>receive(value,name))}catch{}});
      try{window.openai.on('set_globals',value=>{const globals=value?.globals??value;receive(globals?.toolOutput,'set_globals');receive(globals?.toolResponseMetadata,'set_globals.meta')})}catch{}
      bridgeSubscribed=true;event('bridge:attached',{detail:`delay=${Math.round(performance.now())}`});return true;
    }
    window.addEventListener('message',message=>{if(message.source!==window.parent)return;receive(message.data,'postMessage')});
    window.addEventListener('openai:set_globals',message=>receive(message.detail,'set_globals.dom'));
    setInterval(()=>{attachBridge();reportIntrinsicHeight('bridge-poll');if(!lastResults){receive(window.openai?.toolOutput,'poll.output');receive(window.openai?.toolResponseMetadata,'poll.meta')}const hostMode=window.openai?.displayMode;if(hostMode==='fullscreen'&&state.displayMode!=='fullscreen')setDisplayMode('fullscreen',false)},250);

    const year=v=>v.baseIdentity?.year??v.year??'';const make=v=>v.baseIdentity?.make??v.make??'';const model=v=>v.baseIdentity?.model??v.model??'';const trim=v=>v.baseIdentity?.trim??v.trim??'';const vin=v=>v.baseIdentity?.vin??v.vin??'';const price=v=>Number(v.pricing?.price??v.price??0);const miles=v=>Number(v.coreSpecs?.miles??v.miles??0);const dealer=v=>v.location?.dealer??{};const image=v=>v.media?.primaryPhotoUrl||v.media?.photoUrls?.[0]||v.photoUrl||v.image||'';const photos=v=>v.media?.photoUrls?.length?v.media.photoUrls:[image(v)].filter(Boolean);
    const money=value=>value?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(value):'Call for price';
    const shortMoney=value=>value>=1000?`$${(value/1000).toFixed(value>=100000?0:1)}k`:money(value);
    const title=v=>[year(v),make(v),model(v),trim(v)].filter(Boolean).join(' ');
    const coord=v=>{const d=dealer(v),lat=Number(v.lat??d.latitude),lng=Number(v.lng??d.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)?[lat,lng]:null};
    function card(v,kind='list'){return `<article class="vehicle-card ${kind==='list'?'list-card':''} ${v.id===state.selectedId?'active':''}" data-id="${escapeHtml(v.id)}" tabindex="0"><img src="${escapeHtml(image(v)||FALLBACK_IMAGE)}" alt="${escapeHtml(title(v))}"><div class="copy"><div class="vehicle-title">${escapeHtml(title(v))}</div><div class="vehicle-price">${money(price(v))}</div><div class="vehicle-meta">${miles(v)?`${miles(v).toLocaleString()} miles`:'New'} · ${escapeHtml(v.condition||'')}</div><div class="dealer">${escapeHtml(dealer(v).name||v.dealerName||'Dealer')}</div></div></article>`}
    function renderAll(){
      const selected=state.all.find(v=>v.id===state.selectedId)||state.visible[0]||state.all[0];
      $('featured').innerHTML=selected?card(selected,'featured'):'';
      $('rail').innerHTML=state.visible.slice(0,10).map(v=>card(v,'rail')).join('');
      $('list').innerHTML=state.visible.map(v=>card(v,'list')).join('');
      $('resultCount').textContent=`${state.visible.length.toLocaleString()} Vehicles`;
      $('resultContext').textContent=state.query.location||'Visible map area';
      document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',Boolean(state.filters[button.dataset.filter])));
    }
    function selectVehicle(id,source='card',pan=false){
      if(!state.all.some(v=>v.id===id))return;state.selectedId=id;renderAll();MapController.render(false);persistState();event(`selection:${source}`,{detail:id});
      if(pan){const v=state.all.find(item=>item.id===id),c=coord(v);if(c)MapController.map?.panTo(c)}
    }
    function shieldFromMap(node){
      if(!node)return;
      ['pointerdown','pointermove','touchstart','touchmove','wheel'].forEach(type=>{
        node.addEventListener(type,event=>{event.stopPropagation()},{passive:true});
      });
    }
    ['embeddedCards','rail','featured','controls','resultsPane','list','details'].forEach(id=>shieldFromMap($(id)));
    document.addEventListener('click',click=>{
      const thumb=click.target.closest?.('.gallery-thumb');
      if(thumb&&typeof state.setDetailPhoto==='function'){state.setDetailPhoto(Number(thumb.dataset.index||0));return}
      const cardNode=click.target.closest?.('.vehicle-card');
      if(cardNode){selectVehicle(cardNode.dataset.id,'card',true);openDetails(cardNode.dataset.id)}
    });
    document.addEventListener('keydown',key=>{const cardNode=key.target.closest?.('.vehicle-card');if(cardNode&&(key.key==='Enter'||key.key===' ')){key.preventDefault();selectVehicle(cardNode.dataset.id,'keyboard',true);openDetails(cardNode.dataset.id)}});

    const MapController={
      map:null,markers:new Map(),dealerMarkers:[],suppress:false,moveTimer:null,userInteracted:false,initAttempts:0,
      init(){
        if(this.map)return true;
        if(!globalThis.L){this.initAttempts+=1;if(this.initAttempts===1)event('map:leaflet-waiting');return false}
        const rect=$('mapPane').getBoundingClientRect();
        if(rect.width<240||rect.height<240){this.initAttempts+=1;if(this.initAttempts===1||this.initAttempts%10===0)event('map:waiting-for-size',{detail:`${Math.round(rect.width)}x${Math.round(rect.height)}`});return false}
        this.map=L.map('map',{zoomControl:true}).setView([39.5,-98.35],4);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(this.map);
        const container=this.map.getContainer();
        container.addEventListener('pointerdown',()=>{this.userInteracted=true},{passive:true});
        container.addEventListener('wheel',()=>{this.userInteracted=true},{passive:true});
        this.map.on('moveend zoomend',()=>{if(this.suppress||!this.userInteracted)return;clearTimeout(this.moveTimer);this.moveTimer=setTimeout(()=>this.onMove(),180)});
        event('map:initialized',{detail:`${Math.round(rect.width)}x${Math.round(rect.height)}`});
        return true;
      },
      clear(){this.markers.forEach(marker=>marker.remove());this.markers.clear();this.dealerMarkers.forEach(marker=>marker.remove());this.dealerMarkers=[]},
      render(fit=false){if(!this.init()){if(this.initAttempts<80)setTimeout(()=>this.render(fit),150);else event('map:init-failed',{detail:'container-never-reached-minimum-size'});return}this.clear();const zoom=this.map.getZoom();if(zoom<11)this.renderClusters();else this.renderPrices();if(fit)this.fit();},
      renderPrices(){state.all.forEach(v=>{const c=coord(v);if(!c)return;const selected=v.id===state.selectedId;const marker=L.marker(c,{icon:L.divIcon({className:'',html:`<div class="price-pin ${selected?'selected':''}">${shortMoney(price(v))}</div>`,iconAnchor:[0,0]})}).on('click',()=>selectVehicle(v.id,'pin'));marker.addTo(this.map);this.markers.set(v.id,marker)})},
      renderClusters(){const groups=new Map();state.all.forEach(v=>{const d=dealer(v),c=coord(v);if(!c)return;const key=d.dealerId||`${d.name}|${c.join(',')}`;const group=groups.get(key)||{vehicles:[],coord:c,name:d.name||'Dealer'};group.vehicles.push(v);groups.set(key,group)});groups.forEach(group=>{const min=Math.min(...group.vehicles.map(price).filter(Boolean));const marker=L.marker(group.coord,{icon:L.divIcon({className:'',html:`<div class="cluster-pin">${group.vehicles.length} cars<span>From ${shortMoney(min)}</span></div>`,iconAnchor:[0,0]})}).on('click',()=>{this.map.setView(group.coord,13);event('cluster:click',{detail:group.name})});marker.addTo(this.map);this.dealerMarkers.push(marker)})},
      fit(){const coords=state.all.map(coord).filter(Boolean);if(!coords.length)return;this.suppress=true;this.userInteracted=false;this.map.invalidateSize();this.map.fitBounds(L.latLngBounds(coords).pad(.12),{maxZoom:12});setTimeout(()=>{this.suppress=false},600)},
      onMove(){
        if(!state.all.length||!this.userInteracted)return;
        const rect=this.map.getContainer().getBoundingClientRect();
        if(rect.width<240||rect.height<240){event('map:bounds-skipped',{detail:`size=${Math.round(rect.width)}x${Math.round(rect.height)}`});return}
        const bounds=this.map.getBounds();const visible=state.all.filter(v=>{const c=coord(v);return c&&bounds.contains(c)});
        if(!visible.length){event('map:bounds-skipped',{detail:`zero-results;zoom=${this.map.getZoom()}`,vehicleCount:state.visible.length});$('searchArea').classList.remove('hidden');return}
        state.visible=visible;renderAll();$('searchArea').classList.remove('hidden');persistState();event('map:bounds',{detail:`zoom=${this.map.getZoom()}`,vehicleCount:state.visible.length})
      },
      boundsArgs(){const center=this.map.getCenter(),bounds=this.map.getBounds(),ne=bounds.getNorthEast();const radius=Math.max(5,Math.min(500,Math.round(this.map.distance(center,ne)/1609.344)));return{latitude:center.lat,longitude:center.lng,radiusMiles:radius,mapBounds:{north:bounds.getNorth(),south:bounds.getSouth(),east:bounds.getEast(),west:bounds.getWest()}}},
      resize(){setTimeout(()=>{reportIntrinsicHeight('resize');if(this.map){this.map.invalidateSize();this.render(false)}else this.render(Boolean(state.all.length))},100)}
    };

    async function callSearch(overrides,source){
      if(state.pending)return;state.pending=true;document.querySelectorAll('.pill').forEach(button=>button.disabled=true);showStatus('Updating vehicles','Searching live nationwide inventory…');event(`refine:${source}:start`);
      try{
        if(typeof window.openai?.callTool!=='function')throw new Error('ChatGPT tool bridge is unavailable');
        const params={...state.query,...overrides,location:state.query.location||'United States',condition:overrides.condition||state.query.condition||'used'};
        const result=await window.openai.callTool('search-vehicles',params);const next=extractResults(result);if(!next)throw new Error('No updated results were returned');hydrate(next,`callTool:${source}`);$('searchArea').classList.add('hidden');event(`refine:${source}:success`);
      }catch(error){hideStatus();toast(error?.message||'Unable to update search',true);event(`refine:${source}:error`,{detail:String(error?.message||error)})}
      finally{state.pending=false;document.querySelectorAll('.pill').forEach(button=>button.disabled=false)}
    }
    $('controls').addEventListener('click',click=>{const filter=click.target.dataset?.filter;if(!filter)return;if(filter==='used'){state.filters.used=true;state.filters.new=false;callSearch({condition:'used'},'used')}if(filter==='new'){state.filters.new=true;state.filters.used=false;callSearch({condition:'new'},'new')}if(filter==='under30'){state.filters.under30=true;callSearch({maxPrice:30000},'under30')}if(filter==='suv'){state.filters.suv=true;callSearch({bodyStyle:'SUV'},'suv')}});
    $('resetButton').addEventListener('click',()=>{state.filters={};callSearch({condition:state.query.condition||'used',maxPrice:undefined,bodyStyle:undefined,latitude:undefined,longitude:undefined,mapBounds:undefined},'reset')});
    $('searchArea').addEventListener('click',()=>callSearch(MapController.boundsArgs(),'search-area'));
    $('refineButton').addEventListener('click',async()=>{const prompt=`Help me refine my vehicle search near ${state.query.location||'this map area'}. Current filters: ${JSON.stringify(state.filters)}. Ask what I want to change, then update the map.`;persistState();try{if(typeof window.openai?.sendFollowUpMessage!=='function')throw new Error('Use the ChatGPT composer below to refine this search.');await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});event('refine:follow-up:sent')}catch(error){toast(error.message||'Use the ChatGPT composer below to refine this search.');event('refine:follow-up:fallback')}});

    async function setDisplayMode(mode,requestHost=true){
      state.displayMode=mode;document.body.classList.toggle('fullscreen',mode==='fullscreen');$('expandButton').classList.toggle('hidden',mode==='fullscreen');persistState();event(`display:${mode}`);
      if(requestHost&&typeof window.openai?.requestDisplayMode==='function'){try{await window.openai.requestDisplayMode({mode});event(`display:${mode}:accepted`)}catch{event(`display:${mode}:fallback`)}}
      MapController.resize();
    }
    function returnToMap(source='nav'){
      closeDetails();
      if(state.displayMode!=='inline')setDisplayMode('inline',true);
      event(`nav:map:${source}`);
      MapController.resize();
    }
    $('expandButton').addEventListener('click',()=>setDisplayMode('fullscreen',true));
    // Always return to the initial map pane — never close the host widget from this control.
    $('inlineButton').addEventListener('click',()=>returnToMap('results-header'));
    $('sheetHandle').addEventListener('click',()=>{state.sheetExpanded=!state.sheetExpanded;$('resultsPane').classList.toggle('expanded',state.sheetExpanded);persistState();event(`sheet:${state.sheetExpanded?'expanded':'collapsed'}`);MapController.resize()});

    function spec(label,value){return value?`<div class="spec"><label>${escapeHtml(label)}</label><strong>${escapeHtml(value)}</strong></div>`:''}
    function openDetails(id){
      const v=state.all.find(item=>item.id===id);if(!v)return;selectVehicle(id,'detail');
      const p=photos(v).filter(Boolean).slice(0,12);const gallery=p.length?p:[FALLBACK_IMAGE];
      const d=dealer(v),specs=v.coreSpecs||{};let photoIndex=0;
      $('detailTitle').textContent=title(v);
      const galleryHtml=gallery.map((url,index)=>`<button type="button" class="gallery-thumb ${index===0?'active':''}" data-index="${index}" aria-label="Photo ${index+1}"><img src="${escapeHtml(url)}" alt=""></button>`).join('');
      $('detailBody').innerHTML=`<div class="hero-wrap"><img class="hero-image" id="detailHero" src="${escapeHtml(gallery[0])}" alt="${escapeHtml(title(v))}"><button type="button" class="hero-nav prev" id="heroPrev" aria-label="Previous photo">‹</button><button type="button" class="hero-nav next" id="heroNext" aria-label="Next photo">›</button><div class="hero-count" id="heroCount">1 / ${gallery.length}</div></div><div class="gallery" id="detailGallery">${galleryHtml}</div><div class="spec-grid">${spec('Price',money(price(v)))}${spec('Mileage',miles(v)?`${miles(v).toLocaleString()} mi`:'New')}${spec('Condition',v.condition)}${spec('Body',specs.bodyType)}${spec('Drivetrain',specs.drivetrain?.toUpperCase())}${spec('Transmission',specs.transmission?.description)}${spec('Engine',specs.engine?.description)}${spec('VIN',vin(v))}</div><div class="spec" style="margin-top:12px"><label>Dealer</label><strong>${escapeHtml(d.name||'Dealer')}</strong><div class="subtle">${escapeHtml([d.address,d.city,d.state].filter(Boolean).join(', '))}</div></div><div class="actions"><button class="primary-btn" id="bookButton" type="button">Book test drive</button>${v.vdpUrl?'<button class="secondary" id="vdpButton" type="button">Dealer listing</button>':''}<button class="secondary" id="moreLikeButton" type="button">More like this</button></div><div class="vdp-footer-nav"><button class="secondary nav-back" id="detailMapButton" type="button">← Back to map</button><button class="secondary" id="detailCardsButton" type="button">Vehicle cards</button></div>`;
      const setDetailPhoto=index=>{
        if(!gallery.length)return;
        photoIndex=(index+gallery.length)%gallery.length;
        const hero=$('detailHero'),count=$('heroCount'),prev=$('heroPrev'),next=$('heroNext');
        if(hero)hero.src=gallery[photoIndex];
        if(count)count.textContent=`${photoIndex+1} / ${gallery.length}`;
        if(prev)prev.disabled=gallery.length<=1;
        if(next)next.disabled=gallery.length<=1;
        document.querySelectorAll('#detailGallery .gallery-thumb').forEach(node=>node.classList.toggle('active',Number(node.dataset.index)===photoIndex));
        const active=document.querySelector(`#detailGallery .gallery-thumb[data-index="${photoIndex}"]`);
        active?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
      };
      state.setDetailPhoto=setDetailPhoto;
      setDetailPhoto(0);
      $('details').classList.remove('hidden');
      $('detailBody').scrollTop=0;
      $('heroPrev').onclick=()=>setDetailPhoto(photoIndex-1);
      $('heroNext').onclick=()=>setDetailPhoto(photoIndex+1);
      $('detailHero').onclick=()=>{if(gallery.length>1)setDetailPhoto(photoIndex+1)};
      // Horizontal swipe on hero for mobile photo browsing.
      let swipeX=null;
      $('detailHero').ontouchstart=touch=>{swipeX=touch.changedTouches?.[0]?.clientX??null};
      $('detailHero').ontouchend=touch=>{
        if(swipeX==null||gallery.length<=1)return;
        const endX=touch.changedTouches?.[0]?.clientX??swipeX;
        const delta=endX-swipeX;swipeX=null;
        if(Math.abs(delta)<40)return;
        setDetailPhoto(delta<0?photoIndex+1:photoIndex-1);
      };
      shieldFromMap($('detailGallery'));
      $('bookButton').onclick=()=>openLead(v);
      if($('vdpButton'))$('vdpButton').onclick=()=>window.openai?.openExternal?.({href:v.vdpUrl})||window.open(v.vdpUrl,'_blank');
      $('moreLikeButton').onclick=()=>window.openai?.sendFollowUpMessage?.({prompt:`Show me more vehicles like this ${title(v)} near ${state.query.location||'the current area'}.`,scrollToBottom:true});
      $('detailMapButton').onclick=()=>returnToMap('vdp-footer');
      $('detailCardsButton').onclick=()=>{closeDetails();if(state.displayMode==='inline')setDisplayMode('fullscreen',true);event('nav:cards:vdp-footer')};
      event('vehicle:detail',{detail:id});
    }
    function closeDetails(){$('details').classList.add('hidden');state.setDetailPhoto=null;event('nav:close-details')}
    $('detailClose').onclick=()=>{closeDetails();MapController.resize();event('nav:close:vdp-x')};
    $('detailBack').onclick=()=>returnToMap('vdp-back');
    function openLead(v){state.leadVehicle=v;$('leadError').classList.add('hidden');$('leadModal').classList.remove('hidden');event('lead:start',{detail:v.id})}
    $('leadClose').onclick=()=>$('leadModal').classList.add('hidden');
    $('leadForm').addEventListener('submit',async submit=>{submit.preventDefault();const v=state.leadVehicle,d=dealer(v),button=$('leadSubmit');button.disabled=true;button.textContent='Submitting…';try{const result=await window.openai.callTool('submit-lead',{vehicleId:v.id,vin:vin(v),dealerId:d.dealerId,dealerName:d.name,pricing:{price:price(v),currency:v.pricing?.currency||'USD'},user:{name:$('leadName').value,email:$('leadEmail').value,phone:$('leadPhone').value||undefined,preferredTime:$('leadTime').value||undefined},consent:$('leadConsent').checked,searchResultToken:v.searchResultToken});if(result?.error)throw new Error(result.error.message||'Lead submission failed');toast('Request submitted. We’ll confirm with the dealer.');$('leadModal').classList.add('hidden');event('lead:submitted',{detail:v.id})}catch(error){const node=$('leadError');node.textContent=error?.message||'Unable to submit request';node.style.cssText='display:block;background:#7f1d1d;padding:10px;border-radius:8px';node.classList.remove('hidden');event('lead:error',{detail:String(error?.message||error)})}finally{button.disabled=false;button.textContent='Submit request'}});

    const loadedImageHosts=new Set();let imageErrorCount=0;
    function isVehicleImageTarget(node){return node instanceof HTMLImageElement&&!node.closest('.leaflet-container')}
    document.addEventListener('load',load=>{if(!isVehicleImageTarget(load.target))return;const host=(()=>{try{return new URL(load.target.currentSrc||load.target.src).origin}catch{return'invalid'}})();if(!loadedImageHosts.has(host)){loadedImageHosts.add(host);event('image:loaded',{imageHost:host,detail:`host=${host}`})}},true);
    document.addEventListener('error',error=>{if(!isVehicleImageTarget(error.target))return;const host=(()=>{try{return new URL(error.target.currentSrc||error.target.src).origin}catch{return'invalid'}})();if(imageErrorCount<20){imageErrorCount+=1;event('image:error',{imageHost:host,detail:`host=${host};count=${imageErrorCount}`})}if(error.target.src!==FALLBACK_IMAGE){error.target.src=FALLBACK_IMAGE}},true);
    window.addEventListener('error',error=>event('runtime:error',{detail:String(error.message||'unknown')}));
    window.addEventListener('unhandledrejection',error=>event('runtime:rejection',{detail:String(error.reason?.message||error.reason||'unknown')}));

    if(globalThis.ResizeObserver){
      const resizeObserver=new ResizeObserver(entries=>{
        const rect=entries[0]?.contentRect;if(!rect)return;
        reportIntrinsicHeight('observer');
        if(rect.width>=240&&rect.height>=240)MapController.resize();
        event('layout:resize',{detail:`${Math.round(rect.width)}x${Math.round(rect.height)}`});
      });
      resizeObserver.observe($('app'));
    }
    const restored=window.openai?.widgetState;if(restored?.privateContent?.displayMode==='fullscreen')setDisplayMode('fullscreen',false);if(restored?.modelContent?.selectedVehicleId)state.selectedId=restored.modelContent.selectedVehicleId;
    attachBridge();reportIntrinsicHeight('startup');receive(window.openai?.toolOutput,'initial.output');receive(window.openai?.toolResponseMetadata,'initial.meta');MapController.render(false);
    setTimeout(()=>{if(!hasLiveVehicles()){showStatus('Waiting for live vehicle data','ChatGPT is still preparing the map. Results will appear automatically when ready.');scheduleSelfFetch('startup-timeout')}},2500);
  </script>
