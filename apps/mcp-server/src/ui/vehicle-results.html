<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="autoagent-widget-version" content="v39">
  <title>Drevvy Vehicle Results</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#0d0f12;--panel:#17191d;--panel2:#202329;--text:#f8fafc;--muted:#a1a8b3;
      --line:#343842;--blue:#2878ff;--blue2:#1557c8;--red:#d8322f;--shadow:0 12px 32px #0008;
      --touch:44px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--bg);color:var(--text)}
    button,input{font:inherit} button{color:inherit}.hidden{display:none!important}
    #app{position:relative;width:100%;height:420px;min-height:380px;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--bg);display:flex;flex-direction:column}
    #workspace{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;padding:8px 10px 10px}
    #resultsHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 6px;flex:0 0 auto}
    #resultCount{font-weight:750}.subtle{font-size:12px;color:var(--muted)}
    .control-scroll{display:none}
    .pill,.icon-btn,.primary-btn{border:1px solid #ffffff30;background:#15171bea;backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px #0004;min-height:40px}
    .pill:hover,.pill.active,.icon-btn:hover{border-color:#75a7ff;background:#173f78}.pill:disabled{opacity:.55;cursor:wait}
    .icon-btn{width:44px;height:44px;min-height:44px;padding:0;font-size:18px;flex:0 0 auto}
    .primary-btn{background:var(--blue);border-color:var(--blue);border-radius:10px;padding:11px 17px}.primary-btn:hover{background:var(--blue2)}
    #inventoryProgress{display:flex;justify-content:flex-end;margin:0 0 6px;flex:0 0 auto}
    .inventory-progress-button{border:1px solid #ffffff40;background:#15171bf2;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px #0005}
    #railShell{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-rows:minmax(0,1fr);gap:8px;align-items:stretch;min-height:0;flex:1 1 auto}
    #rail{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;padding:0;cursor:grab;min-width:0;height:auto;min-height:0;align-items:stretch;align-self:stretch}
    #rail.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
    #rail::-webkit-scrollbar,.gallery::-webkit-scrollbar,.control-scroll::-webkit-scrollbar{display:none}
    .rail-nav{width:44px;height:44px;border-radius:999px;border:1px solid #ffffff40;background:#15171bf2;backdrop-filter:blur(12px);color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 4px 12px #0005;touch-action:manipulation;align-self:center}
    .rail-nav:disabled{opacity:.35;cursor:default}
    .vehicle-card{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;scroll-snap-align:start;scroll-snap-stop:always;touch-action:manipulation;-webkit-user-select:none;user-select:none;min-height:0}
    .vehicle-card.active{outline:2px solid var(--blue);outline-offset:-2px}
    .vehicle-card img{display:block;width:100%;flex:1 1 0;min-height:140px;height:0;object-fit:cover;object-position:center;background:#292c31;pointer-events:none}
    .vehicle-card .copy{padding:10px 12px 12px;min-width:0;display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
    .vehicle-price{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.15}
    .vehicle-meta,.vehicle-distance{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #rail .vehicle-card{flex:1 0 188px;max-width:240px;min-width:168px;height:auto;align-self:stretch;touch-action:pan-x;cursor:pointer}
    .load-more-card{flex:1 0 188px;max-width:240px;min-width:168px;height:auto;align-self:stretch;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-weight:800;cursor:pointer;padding:16px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center}
    .load-more-card small{display:block;margin-top:4px;color:var(--muted);font-weight:500}
    #status{position:absolute;z-index:900;inset:0;display:grid;place-items:center;background:#0d0f12d9;padding:24px;text-align:center}
    .status-card{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
    .spinner{width:30px;height:30px;border:3px solid #ffffff28;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
    #toast{position:absolute;z-index:1100;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(520px,90%);background:#121417ed;border:1px solid var(--line);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);font-size:13px}
    .drawer,.modal{position:absolute;z-index:1000;inset:0;background:#0e1013f7;overflow:auto;padding:0}
    #details.drawer{display:flex;flex-direction:column;padding:0;overflow:hidden;background:var(--bg)}
    #details.drawer.hidden{display:none!important}
    .drawer-panel,.modal-panel{max-width:760px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
    #details .drawer-panel{display:flex;flex-direction:column;width:100%;height:100%;max-width:none;margin:0;border-radius:0;overflow:hidden;border:0}
    .modal{padding:18px;background:#0e1013f7}
    .drawer-head,.modal-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top))}
    #details .drawer-head{position:relative;flex:0 0 auto;top:auto;min-height:56px}
    .drawer-head h2,.modal-head h2{margin:0;font-size:17px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-back{flex:0 0 auto;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:750;white-space:nowrap;min-height:var(--touch)}
    .close{margin-left:0;background:transparent;border:0;font-size:28px;line-height:1;cursor:pointer;width:44px;height:44px;border-radius:999px}
    .close:hover{background:#ffffff14}
    #detailBody{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:16px;padding-bottom:16px}
    .hero-wrap{position:relative;border-radius:13px;overflow:hidden;background:#292c31}
    .hero-image{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#292c31;touch-action:manipulation}
    body.fullscreen .hero-image{aspect-ratio:16/9}
    .hero-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:999px;background:#0d0f12cc;color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2;touch-action:manipulation}
    .hero-nav.prev{left:8px}.hero-nav.next{right:8px}.hero-nav:disabled{opacity:.35;cursor:default}
    .hero-count{position:absolute;right:10px;bottom:10px;background:#0d0f12cc;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
    .gallery{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;margin-top:10px;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:2px 0 6px}
    .gallery-thumb{flex:0 0 auto;width:112px;height:76px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#292c31;cursor:pointer;scroll-snap-align:start;touch-action:manipulation}
    .gallery-thumb.active{border-color:var(--blue)}.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .vdp-footer-nav{flex:0 0 auto;position:relative;display:flex;gap:8px;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
    .vdp-footer-nav .secondary{flex:1;justify-content:center}
    .spec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.spec{background:#101215;border:1px solid #292d34;border-radius:11px;padding:11px}.spec label{display:block;color:var(--muted);font-size:11px}.spec strong{display:block;margin-top:3px;word-break:break-word}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.secondary{background:#20242a;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation;min-height:var(--touch)}
    form{padding:16px;display:grid;gap:12px}label.field{display:grid;gap:5px;font-weight:700;font-size:13px}input{width:100%;background:#0f1114;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}input:focus{outline:2px solid #4f91ff}
    .consent{display:flex;align-items:flex-start;gap:8px;font-size:13px}.consent input{width:auto;margin-top:2px}
    .label-short{display:none}
    body.fullscreen #app{height:100vh;max-height:none;border:0;border-radius:0;padding-bottom:env(safe-area-inset-bottom)}
    body.fullscreen #workspace{padding:12px 14px 14px}
    body.fullscreen #rail .vehicle-card,body.fullscreen .load-more-card{flex-basis:220px;max-width:280px}
    body.fullscreen #detailBody{max-width:920px;margin:0 auto;width:100%}

    @media(max-width:720px){
      #app{height:400px;min-height:360px;border-radius:16px}
      .label-full{display:none}.label-short{display:inline}
      .rail-nav{display:none}
      #railShell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0}
      #rail{gap:8px;padding:0;scroll-padding-inline:2px}
      #rail .vehicle-card,.load-more-card{flex:1 0 156px;max-width:200px;min-width:148px}
      #rail .vehicle-price{font-size:18px}
      #rail .copy{padding:8px 10px 10px}
      .gallery-thumb{width:88px;height:64px}
      .spec-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
      .actions{flex-direction:column}
      .actions .primary-btn,.actions .secondary{width:100%;justify-content:center}
      .vdp-footer-nav{flex-direction:row}
      .vdp-footer-nav .secondary{width:auto}
      .modal{padding:0}
      .drawer-panel,.modal-panel{min-height:100%;border-radius:0}
      .nav-back{padding:10px 12px}
      body.fullscreen #app{height:100vh;min-height:100vh;border-radius:0}
    }

    @media(min-width:721px){
      #rail .vehicle-card,.load-more-card{flex:1 0 200px;max-width:260px;min-width:180px}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main id="app" aria-label="Vehicle search results">
    <div id="workspace">
      <header id="resultsHeader">
        <div>
          <div id="resultCount">Vehicles</div>
          <div id="resultContext" class="subtle"></div>
        </div>
        <div class="control-scroll" id="controls">
          <button class="pill" data-filter="used">Used</button>
          <button class="pill" data-filter="new">New</button>
          <button class="pill" data-filter="under30">Under $30k</button>
          <button class="pill" data-filter="suv">SUV</button>
          <button class="pill" id="refineButton"><span class="label-full">Refine in ChatGPT</span><span class="label-short">Refine</span></button>
          <button class="pill" id="resetButton">Reset</button>
        </div>
        <button id="expandButton" class="icon-btn" aria-label="Open fullscreen results" title="Open fullscreen">↗</button>
      </header>
      <div id="inventoryProgress"></div>
      <div id="railShell">
        <button type="button" id="railPrev" class="rail-nav" aria-label="Previous vehicles">‹</button>
        <div id="rail" tabindex="0" aria-label="Scrollable vehicle cards"></div>
        <button type="button" id="railNext" class="rail-nav" aria-label="Next vehicles">›</button>
      </div>
    </div>
    <div id="status"><div class="status-card"><div class="spinner"></div><strong id="statusTitle">Loading live vehicles</strong><p id="statusCopy" class="subtle">Connecting to ChatGPT…</p></div></div>
    <div id="toast" class="hidden" role="status"></div>
    <section id="details" class="drawer hidden" aria-modal="true" role="dialog">
      <div class="drawer-panel">
        <header class="drawer-head">
          <button id="detailBack" class="secondary nav-back" type="button" aria-label="Back to results">Back</button>
          <h2 id="detailTitle">Vehicle</h2>
          <button id="detailClose" class="close" type="button" aria-label="Close vehicle details">×</button>
        </header>
        <div id="detailBody"></div>
        <nav id="detailFooter" class="vdp-footer-nav">
          <button class="secondary nav-back" id="detailMapButton" type="button">Results</button>
          <button class="secondary" id="detailCardsButton" type="button">Vehicle cards</button>
        </nav>
      </div>
    </section>
    <section id="leadModal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-panel"><header class="modal-head"><h2>Book Test Drive</h2><button id="leadClose" class="close" aria-label="Close">×</button></header>
        <form id="leadForm"><div id="leadError" class="hidden"></div>
          <label class="field">Full name<input id="leadName" required autocomplete="name"></label>
          <label class="field">Email<input id="leadEmail" type="email" required autocomplete="email"></label>
          <label class="field">Phone<input id="leadPhone" type="tel" autocomplete="tel"></label>
          <label class="field">Preferred contact time<input id="leadTime"></label>
          <label class="consent"><input id="leadConsent" type="checkbox" required> I agree to be contacted by the dealer regarding this vehicle.</label>
          <button id="leadSubmit" class="primary-btn" type="submit">Submit request</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module">
    const VERSION='v39', HOST='https://autoagentmcp-server-production.up.railway.app';
    const RAIL_CARD_LIMIT=8;
    const FALLBACK_IMAGE='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300"><rect width="100%" height="100%" fill="#292c31"/><text x="50%" y="50%" fill="#a1a8b3" font-family="Arial" font-size="22" text-anchor="middle">Vehicle image unavailable</text></svg>');
    const instanceId=`widget_${globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)}`;
    const $=id=>document.getElementById(id);
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const state={all:[],visible:[],query:{},originalQuery:{},dealerSummary:[],totalCount:0,cardLimit:RAIL_CARD_LIMIT,selectedId:null,displayMode:'inline',pending:false,filters:{},flowId:instanceId};
    let readySent=false,bridgeSubscribed=false,lastResults=null,lastHydrationKey='',toastTimer=null,lastReportedHeight=0;
    const mergeDefined=(base,next)=>Object.fromEntries(Object.entries({...base,...next}).filter(([,value])=>value!==undefined));
    function hasLiveVehicles(results=lastResults){
      const vehicles=Array.isArray(results?.vehicles)?results.vehicles:Array.isArray(results)?results:[];
      return vehicles.length>0;
    }
    function captureHostSearchParams(){
      const candidates=[window.openai?.toolInput,window.openai?.widgetState?.modelContent?.currentSearch,state.query];
      for(const input of candidates){
        if(input&&typeof input==='object'){
          pendingSearchParams=mergeDefined(pendingSearchParams,input);
          state.query=mergeDefined(state.query,input);
        }
      }
      const outputResults=extractResults(window.openai?.toolOutput)||extractResults(window.openai?.toolResponseMetadata);
      if(outputResults)rememberSearchParams(outputResults);
    }
    function resolvedSearchParams(){
      captureHostSearchParams();
      const merged={...state.originalQuery,...state.query,...pendingSearchParams};
      const make=typeof merged.make==='string'?merged.make.trim():'';
      const model=typeof merged.model==='string'?merged.model.trim():'';
      const location=typeof merged.location==='string'&&merged.location.trim()?merged.location.trim():'';
      const condition=typeof merged.condition==='string'&&merged.condition.trim()?merged.condition.trim():'used';
      const radiusMiles=Number(merged.radiusMiles)||75;
      const maxPrice=Number(merged.maxPrice);
      const mileageMax=Number(merged.mileageMax);
      const bodyStyle=typeof merged.bodyStyle==='string'?merged.bodyStyle.trim():'';
      const models=Array.isArray(merged.models)?merged.models.filter(value=>typeof value==='string'&&value.trim()).map(value=>value.trim()):[];
      return {make,model,models,location,condition,radiusMiles,...(maxPrice>0?{maxPrice}:{}),...(mileageMax>0?{mileageMax}:{}),...(bodyStyle?{bodyStyle}:{})};
    }

    function reportIntrinsicHeight(reason='update'){
      if(state.displayMode==='fullscreen'||typeof window.openai?.notifyIntrinsicHeight!=='function')return false;
      const appHeight=Math.max(380,Math.ceil($('app')?.getBoundingClientRect().height||420));
      if(Math.abs(appHeight-lastReportedHeight)<4)return true;
      window.openai.notifyIntrinsicHeight(appHeight);
      lastReportedHeight=appHeight;
      event('layout:height',{detail:`${reason}:${appHeight}`});
      return true;
    }

    function event(tag,payload={}){
      const flowId=state.flowId||instanceId;
      fetch(`${HOST}/widget/beacon`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({flowId,rid:flowId,tag,widgetVersion:VERSION,vehicleCount:state.all.length,...payload})}).catch(()=>{});
    }
    function toast(message,error=false){clearTimeout(toastTimer);const node=$('toast');node.textContent=message;node.style.borderColor=error?'#ef4444':'';node.classList.remove('hidden');toastTimer=setTimeout(()=>node.classList.add('hidden'),3500)}
    function showStatus(title,copy){$('statusTitle').textContent=title;$('statusCopy').textContent=copy;$('status').classList.remove('hidden')}
    function hideStatus(){$('status').classList.add('hidden')}
    function extractResults(payload){return payload?.structuredContent?.results||payload?._meta?.results||payload?.result?.structuredContent?.results||payload?.result?._meta?.results||payload?.toolOutput?.structuredContent?.results||payload?.toolOutput?._meta?.results||payload?.toolResponseMetadata?.mcp_tool_result?._meta?.results||payload?.toolResponseMetadata?.call_tool_result?._meta?.results||payload?.results||null}
    let pendingSearchParams=null;let selfFetchAttempted=false;let selfFetchScheduled=false;let selfFetchTimer=null;let emptyResultSeen=false;let definitiveEmpty=false;
    function cancelSelfFetch(){
      if(selfFetchTimer)clearTimeout(selfFetchTimer);
      selfFetchTimer=null;selfFetchScheduled=false;
    }
    function rememberSearchParams(results){
      const next=results?.searchParams||results?.query;
      const original=results?.originalSearchParams;
      if(original&&typeof original==='object'){
        const {pageOffset,...baseOriginal}=original;
        state.originalQuery=mergeDefined(state.originalQuery,baseOriginal);
      }
      if(next&&typeof next==='object'){
        const {pageOffset,...baseParams}=next;
        pendingSearchParams=mergeDefined(pendingSearchParams,baseParams);
        state.query=mergeDefined(state.query,baseParams);
      }
    }
    function persistState(){
      window.openai?.setWidgetState?.({modelContent:{currentSearch:state.query,selectedVehicleId:state.selectedId,visibleVehicleIds:state.visible.slice(0,20).map(v=>v.id),activeFilters:state.filters},privateContent:{displayMode:state.displayMode},imageIds:[]});
    }
    function emitReady(tag){if(readySent||typeof window.openai?.emitToolEvent!=='function')return;window.openai.emitToolEvent('ui:ready',{ok:true,tag,flowId:state.flowId,widgetVersion:VERSION});readySent=true;event('ui-ready',{detail:tag})}
    function showEmptyState(results,source='unknown'){
      definitiveEmpty=true;
      const empty=results?.emptyState;
      const title=empty?.title||'No vehicles found';
      const copy=empty?.message||'Try widening the price, radius, or models in ChatGPT.';
      showStatus(title,copy);
      lastResults=results||{vehicles:[],totalCount:0,emptyState:empty};
      state.all=[];state.visible=[];
      if(results?.searchParams)state.query={...state.query,...results.searchParams};
      event('hydrate:empty-final',{detail:`source=${source}`,vehicleCount:0});
      emitReady('empty');
    }
    function hydrate(results,source='unknown'){
      if(!results)return false;
      rememberSearchParams(results);
      const vehicles=Array.isArray(results.vehicles)?results.vehicles:Array.isArray(results)?results:[];
      if(!vehicles.length){
        if(String(source).includes('load-more')){
          state.totalCount=state.all.length;
          state.cardLimit=state.all.length;
          renderAll();
          toast('All available inventory is loaded');
          event('rail:load-more-complete',{vehicleCount:state.all.length});
          return false;
        }
        if(definitiveEmpty)return false;
        emptyResultSeen=true;
        const total=results.totalCount;
        const hasEmptyState=Boolean(results.emptyState);
        const sourceText=String(source);
        const isDefinitive=hasEmptyState||total===0||sourceText.startsWith('self-fetch:')||sourceText.startsWith('callTool:');
        if(isDefinitive){
          showEmptyState(results,source);
          return false;
        }
        showStatus('Waiting for live vehicle data','ChatGPT is still preparing results. Cards will appear automatically when ready.');
        event('hydrate:empty',{detail:`source=${source}`});
        scheduleSelfFetch('empty-result');
        return false;
      }
      if(String(source).startsWith('self-fetch:')&&hasLiveVehicles()){
        event('hydrate:skip-overwrite',{detail:`source=${source}`,vehicleCount:lastResults?.vehicles?.length||state.all.length});
        return true;
      }
      definitiveEmpty=false;
      const append=String(source).includes('load-more');
      const merged=append?[...state.all]:[];
      const seen=new Set(merged.map(vehicle=>vehicle.id));
      vehicles.forEach(vehicle=>{if(!seen.has(vehicle.id)){seen.add(vehicle.id);merged.push(vehicle)}});
      lastResults={...results,vehicles:merged};
      state.all=merged;
      state.visible=[...merged];
      state.totalCount=Math.max(Number(results.totalCount)||0,merged.length);
      if(!append)state.cardLimit=Math.min(RAIL_CARD_LIMIT,merged.length);
      state.dealerSummary=results.dealerSummary||state.dealerSummary||[];
      state.flowId=vehicles[0]?.flowId||state.flowId;
      state.selectedId=state.selectedId&&merged.some(v=>v.id===state.selectedId)?state.selectedId:merged[0].id;
      cancelSelfFetch();
      hideStatus();closeDetails();renderAll();reportIntrinsicHeight('hydrate');persistState();event('hydrate:success',{detail:`source=${source}`,vehicleCount:vehicles.length});emitReady('hydrated');return true;
    }
    function receive(payload,source){
      const results=extractResults(payload);if(!results)return;
      const vehicles=Array.isArray(results.vehicles)?results.vehicles:[];
      const key=`${vehicles.length}|${results.totalCount||0}|${vehicles[0]?.id||''}|${vehicles[vehicles.length-1]?.id||''}`;
      if(key===lastHydrationKey)return;
      lastHydrationKey=key;hydrate(results,source);
    }
    async function selfFetchVehicles(reason='timeout'){
      if(selfFetchAttempted||hasLiveVehicles()||state.pending||definitiveEmpty)return;
      captureHostSearchParams();
      receive(window.openai?.toolOutput,'self-fetch.precheck.output');
      receive(window.openai?.toolResponseMetadata,'self-fetch.precheck.meta');
      if(hasLiveVehicles()||definitiveEmpty){event('self-fetch:aborted-host-data',{detail:reason});return}
      if(typeof window.openai?.callTool!=='function'){event('self-fetch:unavailable',{detail:reason});return}
      const resolved=resolvedSearchParams();
      if(!resolved.make){
        event('self-fetch:skipped-no-make',{detail:reason});
        if(emptyResultSeen){
          showEmptyState({vehicles:[],totalCount:0,searchParams:resolved,emptyState:{title:'No vehicles found',message:'Still waiting on search details. Ask ChatGPT to search again with make, model, and location.'}},`self-fetch:${reason}`);
        }else{
          showStatus('Waiting for live vehicle data','ChatGPT is still preparing results. Cards will appear automatically when ready.');
        }
        return;
      }
      const params={
        make:resolved.make,
        condition:resolved.condition,
        radiusMiles:resolved.radiusMiles,
      };
      if(resolved.model)params.model=resolved.model;
      if(resolved.location)params.location=resolved.location;
      if(resolved.models.length)params.models=resolved.models;
      if(resolved.maxPrice)params.maxPrice=resolved.maxPrice;
      if(resolved.mileageMax)params.mileageMax=resolved.mileageMax;
      if(resolved.bodyStyle)params.bodyStyle=resolved.bodyStyle;
      selfFetchAttempted=true;state.pending=true;
      showStatus('Loading live vehicles','Refreshing inventory…');
      event('self-fetch:start',{detail:`${reason};make=${params.make};model=${params.model||''}`});
      try{
        const result=await window.openai.callTool('render-vehicle-results-v2',params);
        if(hasLiveVehicles()){event('self-fetch:discarded-stale',{detail:reason});return}
        const next=extractResults(result);
        if(!next||!hydrate(next,`self-fetch:${reason}`)){
          if(!hasLiveVehicles()&&!definitiveEmpty){
            showEmptyState(next||{vehicles:[],totalCount:0},`self-fetch:${reason}`);
            event('self-fetch:empty',{detail:reason});
          }
        }
      }catch(error){
        event('self-fetch:error',{detail:String(error?.message||error)});
        if(emptyResultSeen&&!hasLiveVehicles())showEmptyState({vehicles:[],totalCount:0,emptyState:{title:'No vehicles found',message:'Unable to refresh inventory. Try revising the search in ChatGPT.'}},`self-fetch:${reason}`);
      }finally{state.pending=false}
    }
    function scheduleSelfFetch(reason){
      if(selfFetchScheduled||selfFetchAttempted||definitiveEmpty||hasLiveVehicles())return;
      selfFetchScheduled=true;
      selfFetchTimer=setTimeout(()=>{selfFetchTimer=null;if(!hasLiveVehicles()&&!definitiveEmpty)selfFetchVehicles(reason)},1800);
    }
    function attachBridge(){
      if(bridgeSubscribed||typeof window.openai?.on!=='function')return false;
      ['tool-result','toolResult','ui/notifications/tool-result','openai/tool-result'].forEach(name=>{try{window.openai.on(name,value=>receive(value,name))}catch{}});
      try{window.openai.on('set_globals',value=>{const globals=value?.globals??value;receive(globals?.toolOutput,'set_globals');receive(globals?.toolResponseMetadata,'set_globals.meta')})}catch{}
      bridgeSubscribed=true;event('bridge:attached',{detail:`delay=${Math.round(performance.now())}`});return true;
    }
    window.addEventListener('message',message=>{if(message.source!==window.parent)return;receive(message.data,'postMessage')});
    window.addEventListener('openai:set_globals',message=>receive(message.detail,'set_globals.dom'));
    setInterval(()=>{attachBridge();reportIntrinsicHeight('bridge-poll');if(!lastResults&&!definitiveEmpty){receive(window.openai?.toolOutput,'poll.output');receive(window.openai?.toolResponseMetadata,'poll.meta')}const hostMode=window.openai?.displayMode;if(hostMode==='fullscreen'&&state.displayMode!=='fullscreen')setDisplayMode('fullscreen',false);if(hostMode==='inline'&&state.displayMode==='fullscreen')setDisplayMode('inline',false)},250);

    const year=v=>v.baseIdentity?.year??v.year??'';const make=v=>v.baseIdentity?.make??v.make??'';const model=v=>v.baseIdentity?.model??v.model??'';const trim=v=>v.baseIdentity?.trim??v.trim??'';const vin=v=>v.baseIdentity?.vin??v.vin??'';const price=v=>Number(v.pricing?.price??v.price??0);const miles=v=>Number(v.coreSpecs?.miles??v.miles??0);const dealer=v=>v.location?.dealer??{};const image=v=>v.media?.primaryPhotoUrl||v.media?.photoUrls?.[0]||v.photoUrl||v.image||'';const photos=v=>[image(v),...(v.media?.photoUrls||[])].filter((url,index,all)=>url&&all.indexOf(url)===index);
    const money=value=>value?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(value):'Call for price';
    const title=v=>[year(v),make(v),model(v),trim(v)].filter(Boolean).join(' ');
    function distanceMiles(v){
      const raw=v.distanceMiles??v.location?.dealer?.distanceMiles;
      const n=Number(raw);
      return Number.isFinite(n)&&n>0?n:null;
    }
    function distanceLabel(v){
      const dist=distanceMiles(v);
      if(dist==null)return '';
      const rounded=dist>=10?Math.round(dist):Math.round(dist*10)/10;
      return `${rounded.toLocaleString()} mi away`;
    }
    function imageAttributes(v){const candidates=photos(v);return `src="${escapeHtml(candidates[0]||FALLBACK_IMAGE)}" data-images="${escapeHtml(JSON.stringify(candidates))}" data-image-index="0"`}
    function card(v){const dist=distanceLabel(v);return `<article class="vehicle-card ${v.id===state.selectedId?'active':''}" data-id="${escapeHtml(v.id)}" tabindex="0" role="button" aria-label="${escapeHtml(title(v))}"><img ${imageAttributes(v)} alt="${escapeHtml(title(v))}"><div class="copy"><div class="vehicle-price">${money(price(v))}</div><div class="vehicle-meta">${miles(v)?`${miles(v).toLocaleString()} mi`:'New'}</div>${dist?`<div class="vehicle-distance">${dist}</div>`:''}</div></article>`}
    function vehiclesForRail(){
      const list=[...(state.all.length?state.all:state.visible)];
      if(!state.selectedId)return list.slice(0,state.cardLimit);
      const idx=list.findIndex(v=>v.id===state.selectedId);
      if(idx>0){
        const [selected]=list.splice(idx,1);
        list.unshift(selected);
      }
      return list.slice(0,state.cardLimit);
    }
    function scrollRailToSelected(){
      const rail=$('rail');
      if(!rail||!state.selectedId)return;
      const card=[...rail.querySelectorAll('.vehicle-card')].find(node=>node.dataset.id===state.selectedId);
      if(!card)return;
      rail.scrollTo({left:Math.max(0,card.offsetLeft-rail.offsetLeft),behavior:'smooth'});
      updateRailNav();
    }
    function renderAll(){
      const railVehicles=vehiclesForRail();
      const shown=Math.min(state.cardLimit,state.all.length);
      const hasMore=shown<state.totalCount;
      const moreCount=Math.max(0,state.totalCount-shown);
      const moreLabel=`See more inventory<small>${moreCount.toLocaleString()} more vehicle${moreCount===1?'':'s'}</small>`;
      $('rail').innerHTML=railVehicles.map(v=>card(v)).join('')+(hasMore?`<button type="button" class="load-more-card load-more-trigger">${moreLabel}</button>`:'');
      $('inventoryProgress').innerHTML=hasMore?`<button type="button" class="inventory-progress-button load-more-trigger">Showing ${shown.toLocaleString()} of ${state.totalCount.toLocaleString()} · See all</button>`:`<span class="inventory-progress-button">${shown.toLocaleString()} vehicles</span>`;
      $('resultCount').textContent=`${state.totalCount.toLocaleString()} Vehicles`;
      $('resultContext').textContent=`Showing ${shown.toLocaleString()} of ${state.totalCount.toLocaleString()} · ${state.query.location||'Nearby'}`;
      document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',Boolean(state.filters[button.dataset.filter])));
      updateRailNav();
    }
    async function showMoreInventory(){
      if(state.pending)return;
      state.cardLimit=state.all.length;
      renderAll();
      if(state.all.length<state.totalCount){
        await callSearch({pageOffset:state.all.length},'load-more',true);
        state.cardLimit=state.all.length;
        renderAll();
      }
      requestAnimationFrame(()=>{const button=$('rail')?.querySelector('.load-more-trigger');if(button)button.scrollIntoView({behavior:'smooth',inline:'end',block:'nearest'})});
      event('rail:show-more',{vehicleCount:state.all.length,detail:`total=${state.totalCount}`});
    }
    function selectVehicle(id,source='card'){
      if(!state.all.some(v=>v.id===id))return;
      const selected=state.all.find(item=>item.id===id);
      state.selectedId=id;
      if(selected&&!state.visible.some(item=>item.id===id))state.visible=[selected,...state.visible];
      renderAll();persistState();event(`selection:${source}`,{detail:id});
    }
    let railDrag=null;let suppressCardClick=false;let lastCardOpen={id:null,at:0};
    function openCardFromUi(id,source='card'){
      if(!id||suppressCardClick||railDrag?.moved)return;
      const now=performance.now();
      if(lastCardOpen.id===id&&now-lastCardOpen.at<400)return;
      lastCardOpen={id,at:now};
      selectVehicle(id,source);
      openCardDetails(id);
    }
    function updateRailNav(){
      const rail=$('rail'),prev=$('railPrev'),next=$('railNext');
      if(!rail||!prev||!next)return;
      const maxScroll=Math.max(0,rail.scrollWidth-rail.clientWidth);
      prev.disabled=rail.scrollLeft<=4;
      next.disabled=rail.scrollLeft>=maxScroll-4;
    }
    function scrollRailBy(direction){
      const rail=$('rail');if(!rail)return;
      const amount=Math.max(220,Math.round(rail.clientWidth*0.85))*direction;
      rail.scrollBy({left:amount,behavior:'smooth'});
      setTimeout(updateRailNav,280);
      event(`rail:nav:${direction<0?'prev':'next'}`);
    }
    function bindRailInteractions(){
      const rail=$('rail');if(!rail||rail.dataset.scrollBound)return;
      rail.dataset.scrollBound='1';
      rail.addEventListener('scroll',()=>updateRailNav(),{passive:true});
      rail.addEventListener('wheel',wheel=>{
        if(Math.abs(wheel.deltaY)>Math.abs(wheel.deltaX)){
          rail.scrollLeft+=wheel.deltaY;
          wheel.preventDefault();
        }
        updateRailNav();
      },{passive:false});
      rail.addEventListener('pointerdown',down=>{
        if(down.pointerType!=='mouse'||down.button!==0)return;
        railDrag={pointerId:down.pointerId,startX:down.clientX,startScroll:rail.scrollLeft,moved:false};
      });
      rail.addEventListener('pointermove',move=>{
        if(!railDrag||railDrag.pointerId!==move.pointerId)return;
        const dx=move.clientX-railDrag.startX;

          railDrag.moved=true;
          rail.classList.add('dragging');
          try{rail.setPointerCapture(move.pointerId)}catch{}

        move.preventDefault();
        updateRailNav();
      });

        if(!railDrag||(up.pointerId!=null&&railDrag.pointerId!==up.pointerId))return;
        if(railDrag.moved){suppressCardClick=true;setTimeout(()=>{suppressCardClick=false},50)}
        railDrag=null;rail.classList.remove('dragging');
        updateRailNav();
      };
      rail.addEventListener('pointerup',endDrag);rail.addEventListener('pointercancel',endDrag);
      $('railPrev')?.addEventListener('click',()=>scrollRailBy(-1));
      $('railNext')?.addEventListener('click',()=>scrollRailBy(1));
    }
    bindRailInteractions();
    document.addEventListener('click',click=>{
      if(click.target.closest?.('.rail-nav'))return;
      if(click.target.closest?.('.load-more-trigger')){showMoreInventory();return}
      const thumb=click.target.closest?.('.gallery-thumb');
      if(thumb&&typeof state.setDetailPhoto==='function'){state.setDetailPhoto(Number(thumb.dataset.index||0));return}
      const cardNode=click.target.closest?.('.vehicle-card');
      if(cardNode)openCardFromUi(cardNode.dataset.id,'card');
    });
    document.addEventListener('pointerup',up=>{
      if(up.pointerType==='mouse'&&up.button!==0)return;
      if(up.target.closest?.('#details')||up.target.closest?.('.rail-nav')||up.target.closest?.('.load-more-trigger'))return;
      const cardNode=up.target.closest?.('.vehicle-card');
      if(cardNode)openCardFromUi(cardNode.dataset.id,'card');
    });
    document.addEventListener('keydown',key=>{const cardNode=key.target.closest?.('.vehicle-card');if(cardNode&&(key.key==='Enter'||key.key===' ')){key.preventDefault();openCardFromUi(cardNode.dataset.id,'keyboard')}});

    async function callSearch(overrides,source,quiet=false){
      if(state.pending)return;
      state.pending=true;
      if(!quiet){document.querySelectorAll('.pill').forEach(button=>button.disabled=true);showStatus('Updating vehicles','Searching live nationwide inventory…')}
      event(`refine:${source}:start`);
      try{
        if(typeof window.openai?.callTool!=='function')throw new Error('ChatGPT tool bridge is unavailable');
        captureHostSearchParams();
        const params={...state.originalQuery,...state.query,...overrides,location:state.query.location||state.originalQuery.location||'United States',condition:overrides.condition||state.query.condition||state.originalQuery.condition||'used'};
        const result=await window.openai.callTool('render-vehicle-results-v2',params);const next=extractResults(result);if(!next)throw new Error('No updated results were returned');hydrate(next,`callTool:${source}`);event(`refine:${source}:success`);
      }catch(error){if(!quiet)hideStatus();toast(error?.message||'Unable to update search',true);event(`refine:${source}:error`,{detail:String(error?.message||error)})}
      finally{state.pending=false;document.querySelectorAll('.pill').forEach(button=>button.disabled=false)}
    }
    $('controls').addEventListener('click',click=>{const filter=click.target.dataset?.filter;if(!filter)return;if(filter==='used'){state.filters.used=true;state.filters.new=false;callSearch({condition:'used'},'used')}if(filter==='new'){state.filters.new=true;state.filters.used=false;callSearch({condition:'new'},'new')}if(filter==='under30'){state.filters.under30=true;callSearch({maxPrice:30000},'under30')}if(filter==='suv'){state.filters.suv=true;callSearch({bodyStyle:'SUV'},'suv')}});
    $('resetButton').addEventListener('click',()=>{state.filters={};callSearch({condition:state.query.condition||'used',maxPrice:undefined,bodyStyle:undefined},'reset')});
    $('refineButton').addEventListener('click',async()=>{persistState();try{if(typeof window.openai?.sendFollowUpMessage==='function'){await window.openai.sendFollowUpMessage({prompt:`Help me refine my vehicle search near ${state.query.location||'this area'}. Current filters: ${JSON.stringify(state.filters)}. Ask what I want to change, then update the results.`});event('refine:follow-up:sent')}else{toast('Use Ask ChatGPT below to refine this search.');event('refine:follow-up:fallback')}}catch(error){toast(error.message||'Use Ask ChatGPT below to refine this search.');event('refine:follow-up:fallback')}});

    async function setDisplayMode(mode,requestHost=true){
      state.displayMode=mode;document.body.classList.toggle('fullscreen',mode==='fullscreen');$('expandButton').classList.toggle('hidden',mode==='fullscreen');persistState();event(`display:${mode}`);
      if(requestHost&&typeof window.openai?.requestDisplayMode==='function'){try{await window.openai.requestDisplayMode({mode});event(`display:${mode}:accepted`)}catch{event(`display:${mode}:fallback`)}}
      reportIntrinsicHeight('display');
    }
    function returnToResults(source='nav'){
      closeDetails();
      if(state.displayMode!=='inline')setDisplayMode('inline',true);
      event(`nav:results:${source}`);
    }
    $('expandButton').addEventListener('click',()=>setDisplayMode('fullscreen',true));

    function spec(label,value){return value?`<div class="spec"><label>${escapeHtml(label)}</label><strong>${escapeHtml(value)}</strong></div>`:''}
    function openCardDetails(id){
      openDetails(id);
      if(state.displayMode!=='fullscreen')void setDisplayMode('fullscreen',true);
    }
    function openDetails(id){
      const v=state.all.find(item=>item.id===id);if(!v)return;selectVehicle(id,'detail');
      const p=photos(v).filter(Boolean).slice(0,12);const gallery=p.length?p:[FALLBACK_IMAGE];
      const d=dealer(v),specs=v.coreSpecs||{};let photoIndex=0;
      const dist=distanceMiles(v);
      const distSpec=dist==null?'':`${dist>=10?Math.round(dist):Math.round(dist*10)/10} mi away`;
      $('detailTitle').textContent=title(v);
      const galleryHtml=gallery.map((url,index)=>`<button type="button" class="gallery-thumb ${index===0?'active':''}" data-index="${index}" aria-label="Photo ${index+1}"><img src="${escapeHtml(url)}" alt=""></button>`).join('');
      $('detailBody').innerHTML=`<div class="hero-wrap"><img class="hero-image" id="detailHero" src="${escapeHtml(gallery[0])}" alt="${escapeHtml(title(v))}"><button type="button" class="hero-nav prev" id="heroPrev" aria-label="Previous photo">‹</button><button type="button" class="hero-nav next" id="heroNext" aria-label="Next photo">›</button><div class="hero-count" id="heroCount">1 / ${gallery.length}</div></div><div class="gallery" id="detailGallery">${galleryHtml}</div><div class="spec-grid">${spec('Price',money(price(v)))}${spec('Mileage',miles(v)?`${miles(v).toLocaleString()} mi`:'New')}${spec('Distance',distSpec)}${spec('Condition',v.condition)}${spec('Body',specs.bodyType)}${spec('Drivetrain',specs.drivetrain?.toUpperCase())}${spec('Transmission',specs.transmission?.description)}${spec('Engine',specs.engine?.description)}${spec('VIN',vin(v))}</div><div class="spec" style="margin-top:12px"><label>Dealer</label><strong>${escapeHtml(d.name||'Dealer')}</strong><div class="subtle">${escapeHtml([d.address,d.city,d.state].filter(Boolean).join(', '))}</div></div><div class="actions"><button class="primary-btn" id="bookButton" type="button">Book test drive</button>${v.vdpUrl?'<button class="secondary" id="vdpButton" type="button">Dealer listing</button>':''}<button class="secondary" id="moreLikeButton" type="button">More like this</button></div>`;
      const setDetailPhoto=index=>{
        if(!gallery.length)return;
        photoIndex=(index+gallery.length)%gallery.length;
        const hero=$('detailHero'),count=$('heroCount'),prev=$('heroPrev'),next=$('heroNext');
        if(hero)hero.src=gallery[photoIndex];
        if(count)count.textContent=`${photoIndex+1} / ${gallery.length}`;
        if(prev)prev.disabled=gallery.length<=1;
        if(next)next.disabled=gallery.length<=1;
        document.querySelectorAll('#detailGallery .gallery-thumb').forEach(node=>node.classList.toggle('active',Number(node.dataset.index)===photoIndex));
        const active=document.querySelector(`#detailGallery .gallery-thumb[data-index="${photoIndex}"]`);
        active?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
      };
      state.setDetailPhoto=setDetailPhoto;
      setDetailPhoto(0);
      $('details').classList.remove('hidden');
      $('detailBody').scrollTop=0;
      $('heroPrev').onclick=()=>setDetailPhoto(photoIndex-1);
      $('heroNext').onclick=()=>setDetailPhoto(photoIndex+1);
      $('detailHero').onclick=()=>{if(gallery.length>1)setDetailPhoto(photoIndex+1)};
      let swipeX=null;
      $('detailHero').ontouchstart=touch=>{swipeX=touch.changedTouches?.[0]?.clientX??null};
      $('detailHero').ontouchend=touch=>{
        if(swipeX==null||gallery.length<=1)return;
        const endX=touch.changedTouches?.[0]?.clientX??swipeX;
        const delta=endX-swipeX;swipeX=null;
        if(Math.abs(delta)<40)return;
        setDetailPhoto(delta<0?photoIndex+1:photoIndex-1);
      };
      $('bookButton').onclick=()=>openLead(v);
      if($('vdpButton'))$('vdpButton').onclick=()=>window.openai?.openExternal?.({href:v.vdpUrl})||window.open(v.vdpUrl,'_blank');
      $('moreLikeButton').onclick=()=>{closeDetails();callSearch({make:make(v),model:model(v)},'more-like')};
      event('vehicle:detail',{detail:id});
    }
    function closeDetails(){$('details').classList.add('hidden');state.setDetailPhoto=null;event('nav:close-details')}
    $('detailClose').onclick=()=>{closeDetails();event('nav:close:vdp-x')};
    $('detailBack').onclick=()=>returnToResults('vdp-back');
    $('detailMapButton').onclick=()=>returnToResults('vdp-footer');
    $('detailCardsButton').onclick=()=>{closeDetails();if(state.displayMode==='inline')setDisplayMode('fullscreen',true);event('nav:cards:vdp-footer')};
    function openLead(v){state.leadVehicle=v;$('leadError').classList.add('hidden');$('leadModal').classList.remove('hidden');event('lead:start',{detail:v.id})}
    $('leadClose').onclick=()=>$('leadModal').classList.add('hidden');
    $('leadForm').addEventListener('submit',async submit=>{submit.preventDefault();const v=state.leadVehicle,d=dealer(v),button=$('leadSubmit');button.disabled=true;button.textContent='Submitting…';try{const result=await window.openai.callTool('submit-lead',{vehicleId:v.id,vin:vin(v),dealerId:d.dealerId,dealerName:d.name,pricing:{price:price(v),currency:v.pricing?.currency||'USD'},user:{name:$('leadName').value,email:$('leadEmail').value,phone:$('leadPhone').value||undefined,preferredTime:$('leadTime').value||undefined},consent:$('leadConsent').checked,searchResultToken:v.searchResultToken});if(result?.error)throw new Error(result.error.message||'Lead submission failed');toast('Request submitted. We’ll confirm with the dealer.');$('leadModal').classList.add('hidden');event('lead:submitted',{detail:v.id})}catch(error){const node=$('leadError');node.textContent=error?.message||'Unable to submit request';node.style.cssText='display:block;background:#7f1d1d;padding:10px;border-radius:8px';node.classList.remove('hidden');event('lead:error',{detail:String(error?.message||error)})}finally{button.disabled=false;button.textContent='Submit request'}});

    const loadedImageHosts=new Set();let imageErrorCount=0;
    function isVehicleImageTarget(node){return node instanceof HTMLImageElement}
    document.addEventListener('load',load=>{if(!isVehicleImageTarget(load.target))return;const host=(()=>{try{return new URL(load.target.currentSrc||load.target.src).origin}catch{return'invalid'}})();if(!loadedImageHosts.has(host)){loadedImageHosts.add(host);event('image:loaded',{imageHost:host,detail:`host=${host}`})}},true);
    document.addEventListener('error',error=>{
      if(!isVehicleImageTarget(error.target))return;
      const host=(()=>{try{return new URL(error.target.currentSrc||error.target.src).origin}catch{return'invalid'}})();
      if(imageErrorCount<20){imageErrorCount+=1;event('image:error',{imageHost:host,detail:`host=${host};count=${imageErrorCount}`})}
      let candidates=[];
      try{candidates=JSON.parse(error.target.dataset.images||'[]')}catch{}
      const nextIndex=Number(error.target.dataset.imageIndex||0)+1;
      if(nextIndex<candidates.length){
        error.target.dataset.imageIndex=String(nextIndex);
        error.target.src=candidates[nextIndex];
        event('image:fallback',{detail:`index=${nextIndex}`});
      }else if(error.target.src!==FALLBACK_IMAGE){
        error.target.src=FALLBACK_IMAGE;
      }
    },true);
    window.addEventListener('error',error=>event('runtime:error',{detail:String(error.message||'unknown')}));
    window.addEventListener('unhandledrejection',error=>event('runtime:rejection',{detail:String(error.reason?.message||error.reason||'unknown')}));

    if(globalThis.ResizeObserver){
      const resizeObserver=new ResizeObserver(entries=>{
        const rect=entries[0]?.contentRect;if(!rect)return;
        reportIntrinsicHeight('observer');
        event('layout:resize',{detail:`${Math.round(rect.width)}x${Math.round(rect.height)}`});
      });
      resizeObserver.observe($('app'));
    }
    const restored=window.openai?.widgetState;if(restored?.privateContent?.displayMode==='fullscreen')setDisplayMode('fullscreen',false);if(restored?.modelContent?.selectedVehicleId)state.selectedId=restored.modelContent.selectedVehicleId;
    attachBridge();reportIntrinsicHeight('startup');receive(window.openai?.toolOutput,'initial.output');receive(window.openai?.toolResponseMetadata,'initial.meta');
    setTimeout(()=>{if(!hasLiveVehicles()){captureHostSearchParams();receive(window.openai?.toolOutput,'startup.output');receive(window.openai?.toolResponseMetadata,'startup.meta');if(!hasLiveVehicles()){showStatus('Waiting for live vehicle data','ChatGPT is still preparing results. Cards will appear automatically when ready.');scheduleSelfFetch('startup-timeout')}}},5000);
  </script>
