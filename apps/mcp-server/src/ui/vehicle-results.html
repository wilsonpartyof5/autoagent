<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAgent Vehicle Search</title>
    <!--
        UVS-Only Widget - Tool-Driven Lead Submission
        
        DATA SOURCING:
        - Vehicle data: Exclusively from structuredContent returned by MCP tools (search-vehicles)
        - Globals: Synchronized via set_globals event (rid, locale, user, session)
        - No query-string JSON blobs, no MarketCheck/raw provider data
        - URL params: Only minimal routing (rid, diag) - no vehicle data
        
        LEAD SUBMISSION:
        - Uses window.openai.callTool("submit-lead", payload) - no direct POSTs
        - Payload includes: vehicleId, vin, dealerId, dealerName, pricing.price, pricing.currency, user, consent
        - All fields extracted from UVS structure in structuredContent/globals
        
        ANALYTICS:
        - No PII in analytics events (no VIN, no user data)
        - Only UVS IDs and metadata (vehicleId, dealerId, year, make, model, price)
    -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #111;
            --panel: #1a1a1a;
            --text: #f5f5f5;
            --muted: #9aa0a6;
            --accent: #3b82f6;
            --good: #22c55e;
            --bad: #ef4444;
            --border: #333;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Map */
        .map-container {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Filter pills */
        .filter-pills {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-pill {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .filter-pill:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .filter-pill.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .refine-chips {
            position: absolute;
            top: 64px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .refine-chip {
            border: 1px solid var(--border);
            background: rgba(17, 17, 17, 0.9);
            color: var(--text);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .refine-chip:hover,
        .refine-chip.active {
            border-color: var(--accent);
            color: white;
            background: rgba(59, 130, 246, 0.35);
        }

        /* Result chip */
        .result-chip {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1001;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(10px);
            margin-bottom: 8px;
        }

        /* Bottom sheet */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px var(--shadow);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.collapsed {
            transform: translateY(calc(100% - 160px));
        }

        .bottom-sheet.mid {
            transform: translateY(calc(100% - 55vh));
        }

        .bottom-sheet.expanded {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--muted);
            border-radius: 2px;
            margin: 12px auto;
            cursor: pointer;
        }

        .sheet-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Carousel (collapsed state) */
        .carousel {
            display: flex;
            gap: 16px;
            padding: 0 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            height: 120px;
            align-items: center;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        /* List (mid/expanded state) */
        .list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
        }

        .list.hidden {
            display: none;
        }

        /* Vehicle card */
        .vehicle-card {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
            scroll-snap-align: start;
            min-width: 280px;
            margin-bottom: 16px;
        }

        .vehicle-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .vehicle-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .vehicle-card.carousel-card {
            min-width: 200px;
            margin-bottom: 0;
        }

        .card-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: var(--border);
        }

        .card-content {
            padding: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .price-badge {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .vehicle-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .vehicle-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .dealer-info {
            font-size: 12px;
            color: var(--muted);
        }

        .distance {
            font-size: 12px;
            color: var(--good);
        }

        .deal-score {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 6px;
        }

        .deal-score.great {
            background: rgba(34, 197, 94, 0.25);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .deal-score.fair {
            background: rgba(245, 158, 11, 0.25);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.5);
        }

        .deal-score.high {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .payment-estimate {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        /* Details drawer */
        .details-drawer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--panel);
            z-index: 1001;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .details-drawer.open {
            transform: translateY(0);
        }

        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .drawer-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .spec-item {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .spec-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .spec-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .features {
            margin-bottom: 16px;
        }

        .features-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feature-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .feature-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 12px;
            color: var(--text);
        }

        .seller-comments {
            margin-top: 8px;
            padding: 8px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .seller-comments-text {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .option-packages {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .option-chip {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            color: var(--accent);
            cursor: help;
        }

        .option-chip-more {
            display: inline-block;
            padding: 4px 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 11px;
            color: var(--muted);
        }

        .dealer-block {
            background: var(--bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .dealer-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .dealer-address {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .dealer-actions {
            display: flex;
            gap: 8px;
        }

        .dealer-btn {
            flex: 1;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dealer-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .cta-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .cta-primary {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cta-primary:hover {
            background: #2563eb;
        }

        .cta-secondary {
            flex: 1;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cta-secondary:hover {
            background: var(--bg);
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--muted);
            text-align: center;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Skeletons */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--panel) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .skeleton-image {
            height: 120px;
            border-radius: 12px 12px 0 0;
        }

        .skeleton-content {
            padding: 12px;
        }

        .skeleton-line {
            height: 16px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        /* Lead form modal */
        .lead-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .compare-tray {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 80px;
            z-index: 1800;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(26, 26, 26, 0.96);
            box-shadow: 0 8px 25px var(--shadow);
            padding: 10px 12px;
            display: none;
        }

        .compare-tray.visible {
            display: block;
        }

        .compare-tray-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .compare-tray-cards {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .compare-tray-item {
            min-width: 160px;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 8px;
        }

        .compare-tray-title {
            font-size: 12px;
            font-weight: 600;
        }

        .compare-tray-price {
            color: var(--accent);
            font-size: 13px;
            margin-top: 4px;
        }

        .compare-tray-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .compare-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .compare-modal.open {
            display: flex;
        }

        .compare-panel {
            width: 100%;
            max-width: 960px;
            max-height: 92vh;
            overflow: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .compare-table th,
        .compare-table td {
            border-bottom: 1px solid var(--border);
            padding: 10px 8px;
            text-align: left;
            font-size: 13px;
            vertical-align: top;
        }

        .compare-table th {
            color: var(--muted);
            font-weight: 500;
            width: 160px;
        }

        .lead-modal.open {
            display: flex;
        }

        .lead-form {
            background: var(--panel);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .lead-form h3 {
            margin-bottom: 20px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-checkbox input {
            width: 16px;
            height: 16px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .vin-display {
            background: var(--bg);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .vin-masked {
            color: var(--good);
        }

        .success-message {
            background: var(--good);
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message {
            background: var(--bad);
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        /* Thumbnail mode */
        .thumbnail-mode {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .thumbnail-mode.hidden {
            display: none;
        }

        .thumbnail-map {
            flex: 1;
            position: relative;
            min-height: 300px;
        }

        .thumbnail-map #thumbnailMap {
            width: 100%;
            height: 100%;
        }

        .thumbnail-featured {
            background: var(--panel);
            border-top: 1px solid var(--border);
            padding: 16px;
            max-height: 200px;
        }

        .featured-card {
            display: flex;
            gap: 12px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .featured-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .featured-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }

        .featured-content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .featured-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .featured-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .featured-dealer {
            font-size: 12px;
            color: var(--muted);
        }

        .expand-button {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: all 0.2s;
            z-index: 1001;
        }

        .expand-button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--shadow);
        }

        .price-pin {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid white;
        }

        .full-view.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filter-pills {
                flex-wrap: wrap;
            }

            .refine-chips {
                top: 112px;
            }
            
            .vehicle-card {
                min-width: 250px;
            }
            
            .specs-grid {
                grid-template-columns: 1fr;
            }

            .lead-modal {
                padding: 10px;
            }

            .lead-form {
                padding: 16px;
            }

            .compare-tray {
                bottom: 88px;
            }

            .featured-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const DIAG = params.get('diag') === '1';
      const T0 = performance.now();
      let emitted = false;
      const MAX_WAIT_MS = 5000, INTERVAL_MS = 150;

      // GLOBALS store for OpenAI Apps SDK (make it globally accessible)
      window.GLOBALS = {
        rid: params.get('rid') || null,
        locale: 'en',
        user: {},
        session: {}
      };
      const GLOBALS = window.GLOBALS;

      // Update globals and acknowledge
      function updateGlobals(payload) {
        if (!payload) return;
        if (payload.rid) GLOBALS.rid = payload.rid;
        if (payload.locale) GLOBALS.locale = payload.locale;
        if (payload.user) GLOBALS.user = payload.user;
        if (payload.session) GLOBALS.session = payload.session;
        log('globals updated', GLOBALS);
        
        // Dispatch custom event for widget to react
        window.dispatchEvent(new CustomEvent('aa:globals', { detail: GLOBALS }));
        
        // Acknowledge globals to OpenAI
        if (window.openai?.emitToolEvent && GLOBALS.rid) {
          try {
            window.openai.emitToolEvent('ui:ack_globals', { rid: GLOBALS.rid });
            log('ui:ack_globals emitted', { rid: GLOBALS.rid });
          } catch (e) {
            log('ERR ack_globals', e?.message || e);
          }
        }
      }

      // Listen for set_globals via OpenAI SDK
      if (window.openai?.on) {
        window.openai.on('set_globals', evt => {
          const globals = evt?.globals ?? evt;
          updateGlobals(globals);
        });
      }

      // Fallback: listen for postMessage (legacy openai:set_globals)
      window.addEventListener('message', evt => {
        if (evt.data?.type === 'openai:set_globals') {
          updateGlobals(evt.data?.globals);
        }
      });

      function post(path, body){
        const rid = GLOBALS.rid || 'none';
        try{ fetch(`${path}?rid=${encodeURIComponent(rid)}`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).catch(()=>{});}catch(_){}
      }
      function log(...a){
        try{ (window.__log ||= []).push({t:performance.now(),m:a.join(' ')}); post('/widget/console', window.__log); }catch(_){}
      }
      function beacon(tag, extra){
        const rid = GLOBALS.rid || 'none';
        post('/widget/beacon', Object.assign({ rid, tag, t: performance.now() }, extra||{}));
      }
      function getResults(){
        try{
          if (window.openai && window.openai.toolOutput) {
            return window.openai.toolOutput.structuredContent?.results || null;
          }
          if (window.openai && typeof window.openai.getContext === 'function') {
            const context = window.openai.getContext();
            return context?.structuredContent?.results || context?.results || null;
          }
        }catch(e){ log('ERR getResults', e?.message||e); }
        return window.__AA_MOCK__||null;
      }
      function maybeEmitReady(tag){
        if (emitted) return;
        if (!(window.openai && typeof window.openai.emitToolEvent==='function')) return;
        try{
          const rid = GLOBALS.rid || 'none';
          window.openai.emitToolEvent('ui:ready', { ok:true, tag, rid, elapsedMs: performance.now()-T0 });
          emitted = true;
          beacon('ui-ready:'+tag);
          log('ui:ready emitted', tag);
        }catch(e){ log('ERR emit', e?.message||e); }
      }
      function render(){
        const results = getResults();
        if (!results) return false;
        // In DIAG mode, skip heavy map/photos entirely to isolate validator timing:
        if (DIAG){
          const el = document.createElement('div');
          el.id = 'diag';
          const rid = GLOBALS.rid || 'none';
          el.textContent = `DIAG render (rid=${rid}) vehicles=${results.totalCount ?? results.vehicles?.length ?? 'n/a'}`;
          el.setAttribute('data-aa-results','1');
          document.body.appendChild(el);
          requestAnimationFrame(()=> maybeEmitReady('rendered-diag'));
          return true;
        }
        // TODO: your normal render path (map/list). After first paint:
        requestAnimationFrame(()=> maybeEmitReady('rendered'));
        return true;
      }
      function heartbeat(){
        const haveBridge = !!(window.openai && window.openai.emitToolEvent);
        const haveData = !!getResults();
        if (haveBridge) maybeEmitReady('bridge');
        if (haveData) render();
        if (!emitted){
          if (performance.now()-T0 < MAX_WAIT_MS){ setTimeout(heartbeat, INTERVAL_MS); }
          else { beacon('timeout-fallback'); maybeEmitReady('timeout-fallback'); }
        }
      }

      window.addEventListener('error', e=>{ log('window.error', e?.message||e); beacon('error',{msg:e?.message||'error'}); });
      window.addEventListener('unhandledrejection', e=>{ log('unhandledrejection', String(e?.reason||e)); beacon('error',{msg:String(e?.reason||e)}); });

      document.addEventListener('DOMContentLoaded', ()=>{ 
        const rid = GLOBALS.rid || 'none';
        log('DOMContentLoaded', `rid=${rid}`, `diag=${DIAG}`); 
        beacon('domcontentloaded'); 
        heartbeat(); 
      });
      window.addEventListener('load', ()=>{ log('window.load'); beacon('window.load'); heartbeat(); });

      // extra environment breadcrumbs
      log('ua', navigator.userAgent);
      log('href', location.href);
      log('referrer', document.referrer);
    })();

        (function () {
            const MAX_WAIT_MS = 5000;     // total time to try emitting ui:ready

            // Access GLOBALS from window (defined in first script block)
            const GLOBALS = window.GLOBALS || {

                session: {}
            };

            // ---- logging helpers ----
            function post(path, body){
                try {

                    fetch(url, {
                        method:'POST',
                        headers:{'content-type':'application/json'},
                        body: JSON.stringify(body)
                    }).catch(()=>{});
                } catch(_) {}
            }
            function log(...args){
                try {
                    console.log('[vehicle-widget]', ...args);
                    (window.__log ||= []).push({ts:Date.now(),msg:args.map(String).join(' ')});
                    post('/widget/console', window.__log);
                } catch(_) {}
            }
            function warn(...args){ try{ console.warn('[vehicle-widget]', ...args); }catch(_){} }
            function errorLog(e){ try{ console.error('[vehicle-widget]', e); log('ERROR', e?.message||e); }catch(_){} }

            // ---- data access ----
            // UVS-only: Get vehicle data exclusively from structuredContent returned by MCP tools
            // No query-string JSON blobs, no MarketCheck/raw provider data
            function getResults() {
                try {
                    if (window.openai && window.openai.toolOutput) {
                        return window.openai.toolOutput.structuredContent?.results || null;
                    }
                } catch (e) { errorLog(e); }
                // local dev fallback only
                return window.__AA_MOCK__ || null;
            }

            // ---- emit readiness to ChatGPT ----
            function maybeEmitReady(tag) {
                if (emitted) return;
                const bridge = window.openai && typeof window.openai.emitToolEvent === 'function';
                if (!bridge) return;
                try {
                    const rid = GLOBALS.rid || 'none';
                    window.openai.emitToolEvent('ui:ready', {
                        ok: true, tag, rid, ts: Date.now(), elapsedMs: Date.now() - startedAt
                    });
                    emitted = true;
                    log('ui:ready emitted', tag);
                    // beacon for server visibility
                    post('/widget/beacon', { tag: 'ui-ready:'+tag, rid, ts: Date.now() });
                } catch (e) { errorLog(e); }
            }

            // ---- render once data exists ----
            function render() {
                const results = getResults();
                if (!results) return false;
                
                // Check if we should render thumbnail mode (from structuredContent)
                const vehicles = results.vehicles || [];
                if (vehicles.length > 0 && hasStructuredContentData(vehicles[0])) {
                    renderThumbnailMode(vehicles);
                    // after first paint, confirm ready again
                    requestAnimationFrame(() => maybeEmitReady('rendered-thumbnail'));
                    return true;

                // mark the container so MutationObserver can latch onto it if you want
                // document.querySelector('#results')?.setAttribute('data-aa-results','1');

                // after first paint, confirm ready again
                requestAnimationFrame(() => maybeEmitReady('rendered'));
                return true;
            }

            // Check if vehicle has structuredContent fields (lat, lng, price, photoUrl, title, dealerName)
            function hasStructuredContentData(vehicle) {
                return !!(vehicle.lat && vehicle.lng && vehicle.price && (vehicle.photoUrl || vehicle.image) && vehicle.title && vehicle.dealerName);
            }

            // Render thumbnail mode from structuredContent
            function renderThumbnailMode(vehicles) {
                const thumbnailMode = document.getElementById('thumbnailMode');
                const fullView = document.getElementById('fullView');
                
                if (!thumbnailMode || !fullView) return;
                
                // Show thumbnail, hide full view
                thumbnailMode.classList.remove('hidden');
                fullView.classList.add('hidden');
                
                // Initialize thumbnail map
                initThumbnailMap(vehicles);
                
                // Render featured card (first vehicle)
                renderFeaturedCard(vehicles[0]);

            // Initialize thumbnail map with price pins
            function initThumbnailMap(vehicles) {
                const mapEl = document.getElementById('thumbnailMap');
                if (!mapEl) return;
                if (!(window.L && typeof window.L.map === 'function')) {
                    log('Leaflet unavailable in thumbnail mode; rendering cards without map');
                    return;
                }
                
                // Filter vehicles with valid coordinates
                const validVehicles = vehicles.filter(v => v.lat && v.lng);
                if (validVehicles.length === 0) return;
                
                // Initialize Leaflet map
                const map = L.map('thumbnailMap').setView([validVehicles[0].lat, validVehicles[0].lng], 10);
                
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                // Add price pins
                const markers = [];
                validVehicles.forEach(vehicle => {
                    const price = vehicle.price || 0;
                    const title = vehicle.title || 'Vehicle';
                    const dealerName = vehicle.dealerName || '';
                    
                    // Create custom marker with price label
                    const priceText = price >= 1000 ? `$${(price / 1000).toFixed(1)}k` : `$${price.toLocaleString()}`;
                    
                    const marker = L.marker([vehicle.lat, vehicle.lng], {
                        icon: L.divIcon({
                            className: 'price-pin-marker',
                            html: `<div class="price-pin">${priceText}</div>`,
                            iconSize: [null, null],
                            iconAnchor: [0, 0]
                        })
                    }).bindPopup(`
                        <div style="text-align: center; min-width: 120px;">
                            <strong>${title}</strong><br>
                            <span style="color: #3b82f6; font-weight: bold;">${priceText}</span><br>
                            <span style="font-size: 11px; color: #666;">${dealerName}</span>
                        </div>
                    `);
                    
                    markers.push(marker);
                    marker.addTo(map);
                });

                // Fit map to show all markers
                if (markers.length > 0) {
                    const group = new L.featureGroup(markers);
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            }

            // Render featured card
            function renderFeaturedCard(vehicle) {
                const featuredEl = document.getElementById('thumbnailFeatured');
                if (!featuredEl || !vehicle) return;
                
                const photoUrl = vehicle.photoUrl || vehicle.image || '';
                const title = vehicle.title || 'Vehicle';
                const price = vehicle.price || 0;
                const dealerName = vehicle.dealerName || '';
                const priceText = price >= 1000 ? `$${(price / 1000).toFixed(1)}k` : `$${price.toLocaleString()}`;
                
                featuredEl.innerHTML = `

                        <img src="${photoUrl}"

                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkNhciBJbWFnZTwvdGV4dD48L3N2Zz4='">
                        <div class="featured-content">
                            <div>
                                <div class="featured-title">${title}</div>
                                <div class="featured-price">${priceText}</div>
                                <div class="featured-dealer">${dealerName}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Expand to full view
            window.expandToFullView = function() {
                const thumbnailMode = document.getElementById('thumbnailMode');
                const fullView = document.getElementById('fullView');
                
                if (!thumbnailMode || !fullView) return;
                
                // Hide thumbnail, show full view
                thumbnailMode.classList.add('hidden');
                fullView.classList.remove('hidden');
                
                // Initialize full view if not already done
                if (typeof window.initFullView === 'function') {
                    setTimeout(() => {
                        window.initFullView();
                    }, 100);
                }
            };

            // ---- heartbeat: poll for bridge+data, never hang ----
            function heartbeat() {
                const haveBridge = !!(window.openai && window.openai.emitToolEvent);
                const haveData   = !!getResults();

                // emit as soon as bridge is present (don't wait for data)
                if (haveBridge) { maybeEmitReady('bridge'); }
                // render when data shows up
                if (haveData) { render(); }

                const elapsed = Date.now() - startedAt;
                if (!emitted && elapsed < MAX_WAIT_MS) {
                    setTimeout(heartbeat, INTERVAL_MS);
                } else if (!emitted) {
                    // last-ditch: emit so validator doesn't time out
                    warn('ui:ready timeout fallback');
                    maybeEmitReady('timeout-fallback');
                }
            }

            // ---- lifecycle hooks ----
            document.addEventListener('DOMContentLoaded', () => { log('DOMContentLoaded'); heartbeat(); });
            window.addEventListener('load', () => { log('window.load'); heartbeat(); });

            // global error trap
            window.addEventListener('error', (e) => errorLog(e?.error||e?.message||e));
        })();

        // Load UVS vehicle data from structuredContent (returned by MCP tools)
        // Hydrates exclusively from structuredContent/set_globals - no URL params or raw provider data
        function loadData() {
            let retryCount = 0;
            const maxRetries = 3;
            
            function attemptLoad() {
                try {
                    const results = getResults();
                    if (results) {
                        // UVS vehicles from structuredContent
                        state.vehicles = results.vehicles || results;
                        state.allVehicles = [...state.vehicles];
                        state.query = results.searchParams || results.query || {};
                        console.log('UVS data loaded from structuredContent');
                        refreshVehiclesView();
                    } else if (retryCount < maxRetries) {
                        retryCount++;
                        console.log(`Retrying data load (${retryCount}/${maxRetries})...`);
                        setTimeout(attemptLoad, 500);
                        return;
                    } else {
                        // Final fallback to mock data (dev only)
                        console.log('Using fallback mock data (dev mode)');
                        state.vehicles = mockVehicles;
                        state.allVehicles = [...state.vehicles];
                        state.query = {
                            location: 'Seattle, WA',
                            condition: 'used',
                            maxPrice: 30000
                        };
                        refreshVehiclesView();
                    }
                } catch (error) {
                    console.error('Error loading data:', error);
                    if (retryCount < maxRetries) {
                        retryCount++;
                        setTimeout(attemptLoad, 500);
                    } else {
                        state.vehicles = mockVehicles;
                        state.allVehicles = [...state.vehicles];
                        state.query = { location: 'Seattle, WA' };
                        refreshVehiclesView();
                    }
                }
            }
            
            attemptLoad();
        }

        function refreshVehiclesView() {
            try {
                initMap();
            } catch (error) {
                console.warn('Map render skipped due to runtime error', error);
            }
            renderCards();
            updateResultChip();
            setupIntersectionObserver();
            syncCompareTray();
        }

        // Initialize map
        function initMap() {
            if (!(window.L && typeof window.L.map === 'function')) {
                console.warn('Leaflet unavailable; skipping map rendering');
                return;
            }
            if (!state.map) {
                state.map = L.map('map').setView([47.6062, -122.3321], 10);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(state.map);
            }

            state.markers.forEach((marker) => marker.remove());
            state.markers = [];

            // Add markers for visible vehicles with coordinates
            state.vehicles.forEach(vehicle => {
                const dealer = getUVSDealer(vehicle);
                if (dealer?.latitude && dealer?.longitude) {
                    const year = getUVSYear(vehicle);
                    const make = getUVSMake(vehicle);
                    const model = getUVSModel(vehicle);
                    const price = getUVSPrice(vehicle);
                    const marker = L.marker([dealer.latitude, dealer.longitude])
                        .bindPopup(`
                            <div style="text-align: center;">
                                <strong>${year} ${make} ${model}</strong><br>
                                <span style="color: #3b82f6; font-weight: bold;">${fmtPrice(price)}</span>
                            </div>
                        `)
                        .on('click', () => {
                            logEvent('pin_click', { id: vehicle.id });
                            setActiveVehicle(vehicle.id);
                            scrollToCard(vehicle.id);
                        });
                    
                    state.markers.push(marker);
                    marker.addTo(state.map);
                }
            });

            // Fit map to show all markers
            if (state.markers.length > 0) {
                const group = new L.featureGroup(state.markers);
                state.map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // Compare vehicle workflow (tray + modal)
        function compareVehicle(id) {
            const vehicle = state.vehicles.find(v => v.id === id);
            if (!vehicle) return;

            // Add to compare list (max 3 vehicles)
            if (!state.compareList.find(v => v.id === id)) {
                if (state.compareList.length < 3) {
                    state.compareList.push(vehicle);
                } else {
                    state.compareList.shift();
                    state.compareList.push(vehicle);
                }
            }
            syncCompareTray();

            // If we have at least 2 vehicles, track compare event
            if (state.compareList.length >= 2) {
                const vehicleIds = state.compareList.map(v => v.id);
                const dealer = getUVSDealer(state.compareList[0]);
                // Extract dealerId from UVS structure: location.dealer.dealerId
                const dealerId = dealer?.dealerId || state.compareList[0]?.location?.dealer?.dealerId;

                // Track compare event (no PII - no VINs)
                logEvent('vehicle.compare', {
                    vehicleIds: vehicleIds,
                    compareCount: vehicleIds.length,
                    dealerId,
                });
            }
        }

        async function submitLead(event) {
            event.preventDefault();
            
            const submitButton = el('submitButton');
            const successMessage = el('successMessage');
            const errorMessage = el('errorMessage');
            
            // Disable submit button
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            
            try {
                // Extract UVS fields for lead submission from structuredContent/globals
                const vin = getUVSVIN(currentVehicle);
                const dealer = getUVSDealer(currentVehicle);
                const pricing = currentVehicle.pricing || {};
                const price = pricing.price || pricing.currentPrice || 0;
                const currency = pricing.currency || 'USD';
                
                // Validate required UVS fields
                if (!vin) {
                    throw new Error('VIN is required from UVS vehicle data');
                }
                if (!dealer?.dealerId) {
                    throw new Error('dealerId is required from UVS vehicle data');
                }
                if (!dealer?.name) {
                    throw new Error('dealerName is required from UVS vehicle data');
                }
                if (!price || price <= 0) {
                    throw new Error('Price is required from UVS vehicle data');
                }

                const formData = {
                    vehicleId: currentVehicle.id,
                    vin: vin,
                    dealerId: dealer.dealerId,
                    dealerName: dealer.name,
                    pricing: {
                        price: price,
                        currency: currency,
                    },
                    user: {
                        name: el('leadName').value,
                        email: el('leadEmail').value,
                        phone: el('leadPhone').value || undefined,
                        preferredTime: el('leadTime').value || undefined,
                    },
                    consent: el('leadConsent').checked,
                };

                if (!window.openai?.callTool) {
                    throw new Error('openai.callTool is not available');
                }

                // Submit lead via tool call (no direct POSTs)
                const toolResult = await window.openai.callTool('submit-lead', formData);

                if (toolResult?.structuredContent?.leadId) {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    
                    // Close modal after 2 seconds
                    setTimeout(() => {
                        closeLeadModal();
                    }, 2000);
                } else {
                    throw new Error(toolResult?.error || 'Unknown error');
                }
            } catch (error) {
                console.error('Lead submission error:', error);
                errorMessage.style.display = 'block';
                errorMessage.textContent = error.message || 'There was an error submitting your request. Please try again.';
                successMessage.style.display = 'none';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Request';
            }
        }

        function setActiveRefineChip(refineKey) {
            document.querySelectorAll('.refine-chip').forEach((chip) => {
                chip.classList.toggle('active', chip.dataset.refine === refineKey);
            });
        }

        function applyRefine(refineKey) {
            state.activeRefine = refineKey === 'reset' ? null : refineKey;
            let nextVehicles = [...state.allVehicles];
            switch (refineKey) {
                case 'under-30000':
                    nextVehicles = nextVehicles.filter(v => (getUVSPrice(v) || 0) <= 30000);
                    break;
                case 'low-mileage':
                    nextVehicles = nextVehicles.filter(v => {
                        const miles = getUVSMiles(v);
                        return typeof miles === 'number' ? miles <= 40000 : true;
                    });
                    break;
                case 'awd':
                    nextVehicles = nextVehicles.filter(v => {
                        const features = getUVSFeatures(v).map(f => String(f).toLowerCase());
                        return features.some(f => f.includes('awd') || f.includes('all-wheel'));
                    });
                    break;
                case 'newest':
                    nextVehicles = nextVehicles.sort((a, b) => (getUVSYear(b) || 0) - (getUVSYear(a) || 0));
                    break;
                default:
                    break;
            }
            state.vehicles = nextVehicles;
            setActiveRefineChip(state.activeRefine);
            refreshVehiclesView();
            logEvent('filter.apply', { filter: refineKey, results: state.vehicles.length });
        }

        function applyFilterPill(filterKey) {
            switch (filterKey) {
                case 'price':
                    applyRefine('under-30000');
                    break;
                case 'condition':
                    state.vehicles = [...state.allVehicles].filter(v => getUVSCondition(v) === (state.query.condition || 'used'));
                    refreshVehiclesView();
                    break;
                case 'radius':
                    state.vehicles = [...state.vehicles].sort((a, b) => {
                        const da = getUVSDealer(a)?.distanceMiles || 999;
                        const db = getUVSDealer(b)?.distanceMiles || 999;
                        return da - db;
                    });
                    refreshVehiclesView();
                    break;
                case 'make': {
                    const make = state.query.make || getUVSMake(state.allVehicles[0]);
                    state.vehicles = [...state.allVehicles].filter(v => getUVSMake(v) === make);
                    refreshVehiclesView();
                    break;
                }
                default:
                    applyRefine('reset');
                    break;
            }
            logEvent('filter_click', { filter: filterKey, results: state.vehicles.length });
        }

        // Sheet state management
        function setSheetState(newState) {
            state.sheetState = newState;
            const sheet = el('bottomSheet');
            const carousel = el('carousel');
            const list = el('list');

            sheet.className = `bottom-sheet ${newState}`;
            sheet.setAttribute('aria-expanded', newState !== 'collapsed');

            if (newState === 'collapsed') {
                carousel.style.display = 'flex';
                list.classList.add('hidden');
            } else {
                carousel.style.display = 'none';
                list.classList.remove('hidden');
            }

            logEvent('sheet_state', { state: newState });
        }

        // Event logging
        // Get or create session ID for analytics
        function getOrCreateSessionId() {
            let sessionId = localStorage.getItem('aa_widget_session_id');
            if (!sessionId) {
                sessionId = 'widget_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('aa_widget_session_id', sessionId);
            }
            return sessionId;
        }

        // Get widget host from current page URL
        function getWidgetHost() {
            const urlParams = new URLSearchParams(window.location.search);
            const widgetHost = urlParams.get('host') || window.location.origin;
            return widgetHost.replace(/\/$/, '');
        }

        // Track analytics event (no PII - only UVS IDs and metadata)
        function logEvent(eventName, data) {
            // Log to console for debugging (no PII)
            console.log(JSON.stringify({ event: eventName, ...data }));
            
            // Send to analytics endpoint (no PII)
            const widgetHost = getWidgetHost();
            const sessionId = getOrCreateSessionId();
            
            // Extract vehicle data if available (UVS structure only)
            const vehicle = data.vehicle || state.vehicles.find(v => v.id === data.id || v.id === data.vehicleId);
            const dealerId = vehicle?.location?.dealer?.dealerId || data.dealerId;
            const vehicleId = vehicle?.id || data.id || data.vehicleId;
            
            // Send analytics event to widget tracking endpoint (no PII - no VIN, no user data)
            fetch(`${widgetHost}/widget/track`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    eventName: eventName,
                    payload: {
                        // Only include non-PII metadata
                        vehicleId: vehicleId,
                        year: vehicle?.baseIdentity?.year,
                        make: vehicle?.baseIdentity?.make,
                        model: vehicle?.baseIdentity?.model,
                        price: vehicle?.pricing?.price || vehicle?.pricing?.currentPrice,
                        source: data.source || 'widget',
                    },
                    sessionId: sessionId,
                    dealerId: dealerId,
                    vehicleId: vehicleId,
                    requestId: 'widget_' + Date.now(),
                }),
            }).catch(err => {
                // Silently fail - analytics should not break widget
                console.error('Failed to track event:', err);
            });
        }

        // Intersection observer for card visibility
        function setupIntersectionObserver() {
            const viewedVehicles = new Set(); // Track which vehicles have been viewed
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.dataset.id;
                        if (id && id !== state.activeId) {
                            setActiveVehicle(id);
                        }
                        
                        // Track vehicle.view event (once per vehicle, no PII)
                        if (id && !viewedVehicles.has(id)) {
                            viewedVehicles.add(id);
                            const vehicle = state.vehicles.find(v => v.id === id);
                            if (vehicle) {
                                logEvent('vehicle.view', {
                                    id,
                                    vehicleId: vehicle.id,
                                    source: 'widget_card',
                                });
                            }
                        }
                    }
                });
            }, { threshold: 0.5 });

            // Observe all cards when they're rendered
            setTimeout(() => {
                document.querySelectorAll('.vehicle-card').forEach(card => {
                    observer.observe(card);
                });
            }, 100);
        }

        // Event listeners
        function setupEventListeners() {
            // Sheet handle
            el('sheetHandle').addEventListener('click', () => {
                const nextState = state.sheetState === 'collapsed' ? 'mid' : 
                                state.sheetState === 'mid' ? 'expanded' : 'collapsed';
                setSheetState(nextState);
            });

            // Drawer close
            el('drawerClose').addEventListener('click', closeDetails);

            // Filter pills
            document.querySelectorAll('.filter-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    const filter = pill.dataset.filter;
                    applyFilterPill(filter);
                });
            });

            // Refine chips
            document.querySelectorAll('.refine-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    applyRefine(chip.dataset.refine);
                });
            });

            // Click backdrop to close drawer
            el('detailsDrawer').addEventListener('click', (e) => {
                if (e.target === el('detailsDrawer')) {
                    closeDetails();
                }
            });

            // Lead form submission
            el('leadForm').addEventListener('submit', submitLead);

            // Click backdrop to close lead modal
            el('leadModal').addEventListener('click', (e) => {
                if (e.target === el('leadModal')) {
                    closeLeadModal();
                }
            });

            // Click backdrop to close compare modal
            el('compareModal').addEventListener('click', (e) => {
                if (e.target === el('compareModal')) {
                    closeCompareModal();
                }
            });
        }

        // Initialize app
        function init() {
            // Check if thumbnail mode should be shown first
            const results = getResults();
            const vehicles = results?.vehicles || [];
            const shouldShowThumbnail = vehicles.length > 0 && vehicles[0] && 
                vehicles[0].lat && vehicles[0].lng && vehicles[0].price && 
                (vehicles[0].photoUrl || vehicles[0].image) && vehicles[0].title && vehicles[0].dealerName;
            
            if (shouldShowThumbnail) {
                // Thumbnail mode will be rendered by the render() function in the first script block
                // Just set up event listeners
                setupEventListeners();
                return;
            }
            
            // Otherwise initialize full view
            loadData();
            setupEventListeners();
        }

        // Start the app
        init();

        // Make functions globally available
        window.openDetails = openDetails;
        window.bookTestDrive = bookTestDrive;
        window.getQuote = getQuote;
        window.callDealer = callDealer;
        window.getDirections = getDirections;
        window.compareVehicle = compareVehicle;
        window.removeCompareVehicle = removeCompareVehicle;
        window.clearCompare = clearCompare;
        window.openCompareModal = openCompareModal;
        window.closeCompareModal = closeCompareModal;
        window.closeLeadModal = closeLeadModal;
        
        // Expose full view initialization functions for expand button
        window.initFullView = function() {
            if (!state.map) {
                loadData();
            }
        };
    </script>
</body>
</html>
