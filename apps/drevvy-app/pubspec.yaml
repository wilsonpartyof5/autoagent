name: drevvy_app
description: "Drevvy shopper app - AI car-buying assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # Icons
  lucide_icons_flutter: ^3.1.24
  flutter_svg: ^2.0.17
  
  # UI Utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  http: ^1.5.0
  crypto: ^3.0.6
  purchases_flutter: ^10.15.2
  # 2.4.10+ requires a pigeon/analyzer newer than riverpod_generator 2.6.
  superwallkit_flutter: 2.4.9

  # Auth — session lives in the platform keychain / keystore.
  flutter_secure_storage: ^10.0.0
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0

  # Push. Permission is requested after the first car is added, not at launch.
  # TODO: drop in real Firebase config before shipping. See lib/core/config/drevvy_config.dart.
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
