<!DOCTYPE html>
<html>
  <body>
    <p>Stock #H24118</p>
    <form id="private-lead">
      <h2>Check Availability</h2>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" required />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" required />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="street">Street address</label>
      <input id="street" name="street_address" required />
      <label for="dob">Date of birth</label>
      <input id="dob" name="date_of_birth" required />
      <label for="ssn">SSN</label>
      <input id="ssn" name="ssn" required />
      <label for="payoff">Trade payoff</label>
      <input id="payoff" name="trade_payoff" required />
      <button type="submit">Check Availability</button>
    </form>
  </body>
</html>
