<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.gubagoo.com/toolbars/v1/toolbar.js" async></script>
  </head>
  <body>
    <h1>2024 Honda Civic</h1>
    <p>Stock #H24118</p>
    <button type="button" class="gg-chat-launcher">Chat</button>
    <textarea id="gg-chat-input" class="gg-chat-input" aria-label="message"></textarea>
    <form id="ask-phone">
      <h2>Ask a Question</h2>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" required />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" required />
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments"></textarea>
      <button type="submit">Ask a Question</button>
    </form>
  </body>
</html>
