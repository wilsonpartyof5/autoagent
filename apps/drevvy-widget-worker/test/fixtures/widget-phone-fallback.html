<!DOCTYPE html>
<html>
  <body>
    <script src="https://widget.podium.com/widget.js"></script>
    <h1>2024 Honda Civic</h1>
    <p>Stock #H24118</p>
    <div id="podium-bubble" class="podium-website-widget">
      <form id="podium-text-us">
        <h2>Text us</h2>
        <label for="podium-name">Name</label>
        <input id="podium-name" name="name" required />
        <label for="podium-mobile">Mobile Phone</label>
        <input id="podium-mobile" name="mobile" type="tel" required />
        <button type="submit">Text us</button>
      </form>
    </div>
    <form id="check-availability">
      <h2>Check Availability</h2>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" required />
      <label for="last_name">Last Name</label>
      <input id="last_name" name="last_name" required />
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required />
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments"></textarea>
      <button type="submit">Check Availability</button>
    </form>
  </body>
</html>
