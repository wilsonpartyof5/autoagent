<!DOCTYPE html>
<html>
  <body>
    <script src="https://cdn.gubagoo.com/toolbars/v1/toolbar.js"></script>
    <p>Stock #H24118</p>
    <div id="gubagoo-chat" class="gg-chat">
      <form id="gg-private">
        <label for="visitor-name">Your name</label>
        <input id="visitor-name" name="your_name" />
        <label for="visitor-phone">Mobile Phone</label>
        <input id="visitor-phone" name="phone" type="tel" />
        <label for="street">Street address</label>
        <input id="street" name="street_address" />
        <label for="dob">Date of birth</label>
        <input id="dob" name="date_of_birth" />
        <label for="ssn">SSN</label>
        <input id="ssn" name="ssn" />
        <label for="payoff">Trade payoff</label>
        <input id="payoff" name="trade_payoff" />
        <button type="submit">Start chat</button>
      </form>
    </div>
  </body>
</html>
