name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @autoagent/shared typecheck && pnpm --filter @autoagent/mcp-server typecheck

      - name: Lint
        if: github.event_name == 'pull_request'
        run: pnpm --filter @autoagent/mcp-server lint

      - name: Build
        run: pnpm --filter @autoagent/shared build && pnpm --filter @autoagent/mcp-server build

      - name: Test
        run: pnpm --filter @autoagent/mcp-server test
