name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm --filter @drevvy/backend typecheck

      - name: Test shopper APIs
        run: pnpm --filter @drevvy/backend test:shopper && pnpm --filter @drevvy/backend test:shopper-deals && pnpm --filter @drevvy/backend test:admin && pnpm --filter @drevvy/backend test:get && pnpm --filter @drevvy/backend test:sms && pnpm --filter @drevvy/backend test:marketcheck && pnpm --filter @drevvy/backend test:dealer

      - name: Build backend
        run: pnpm --filter @drevvy/backend build
